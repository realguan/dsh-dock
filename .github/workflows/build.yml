# 跨平台桌面客户端构建（DSH Dock）
#
# 两段式：
# 1) push / PR / 手动 → 三平台矩阵构建验证 + artifact 上传（开发态）
# 2) tag v* → 同一矩阵构建 + 聚合为 GitHub Release（发布态）
#
# 默认壳：本仓库 resources/product.manifest.json（极简档：system → download，
# 不携带快照；见 docs/contract.md）。产物为自解压安装包 / .app / .dmg / .deb。
name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  # tauri-cli 必须与 tauri crate（2.11.x）同代：cli 2.8.4 的 bundler 对
  # createUpdaterArtifacts 的产物布局/二进制补丁与 2.11 不一致（CI 实测
  # __TAURI_BUNDLE_TYPE 补丁失败 + Linux updater 签名形态不同）。
  TAURI_CLI_VERSION: "2.11.4"

# release job 需要创建 GitHub Release → GITHUB_TOKEN 显式授 contents: write
permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Tauri v2 官方要求的系统依赖（Linux 构建安装包必需）
      - name: Ubuntu system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      # 客户端自更新签名（2026-08-25 接入）：
      # 私钥在 GitHub secrets（TAURI_SIGNING_PRIVATE_KEY，空密码 minisign 密钥）。
      # tauri-cli 在 plugins.updater.pubkey 配置存在时要求私钥签名 updater 产物
      # （.app.tar.gz / *.nsis.zip / *.msi.zip / .AppImage.tar.gz 的 .sig 文件）。
      # 无私钥（fork PR 场景）→ 构建会因缺私钥而失败，这是刻意行为：
      # pubkey 配置存在即要求签名，宁可不发布也不出未签名产物。
      - name: Set up updater signing key
        # Windows runner 默认 shell 是 PowerShell：显式指定 bash（Git Bash 在
        # GitHub Actions runner 上可用；macOS/Linux 默认 bash 一致）。
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::warning::未配置 TAURI_SIGNING_PRIVATE_KEY —— updater 产物将无法签名"
          else
            echo "TAURI_SIGNING_PRIVATE_KEY=$TAURI_SIGNING_PRIVATE_KEY" >> "$GITHUB_ENV"
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=" >> "$GITHUB_ENV"
          fi

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "${{ env.TAURI_CLI_VERSION }}" --locked

      - name: Unit tests
        working-directory: src-tauri
        run: cargo test

      # 前端构建（2026-08-27 前端迁移，ADR-0008）：beforeBuildCommand 钩子会跑
      # npm ci && npm run build；锁文件 = frontend/package-lock.json（node 22 LTS）。
      - name: Setup node for frontend
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 前端质量闸门（typecheck/lint/vitest，frontend-migration §6）：
      # fmt/clippy 基线评估结论（2026-08-27）：repo 存量 35 文件未归一 + clippy
      # 9 警告，需专项 chore 落地，本轮不接入以免 CI 即红——roadmap §4.1 保持 [待补充]。
      - name: Frontend gates
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run lint
          npm run test

      # 注意：updater 签名需要 TAURI_SIGNING_PRIVATE_KEY（已在上一步设置到 env）。
      # 有 key → 正常构建（含 .sig）；无 key（fork PR 无 secrets）→ `--no-sign`
      # 跳过签名（tauri-cli 在 pubkey 配置存在且无私钥时会直接报错——刻意保护，
      # 宁可不发布也不出未签名产物；`--no-sign` 只用于保持 fork PR 构建可跑）。
      - name: Build installers
        # Windows runner 默认 shell 是 PowerShell：显式 bash（与 key 检查一致）。
        shell: bash
        # 2026-08-27 前端迁移：tauri-cli 跑 hook 前会把进程 cwd 切到 src-tauri
        # （build.rs set_current_dir），hook 的 script/cwd 均相对该目录——
        # tauri.conf.json 已显式配置 cwd="../frontend"；自动发现 package.json
        # 在 Linux 上可能先命中 node-map/（CI 实证失败），不再依赖。
        working-directory: .
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            cargo tauri build
          else
            echo "::warning::无签名 key，以 --no-sign 构建（fork PR / 无 secrets 场景）"
            cargo tauri build --no-sign
          fi

      # 诊断：打印 bundle 产物布局（updater 文件真实路径靠日志定，不靠猜）。
      - name: List bundle outputs
        shell: bash
        working-directory: src-tauri
        run: find target/release/bundle -type f | sort

      # 只上传安装器「文件」(.dmg/.exe/.msi/.deb/.rpm/.AppImage)——
      # 不打包整个 bundle 目录（含 .app 应用目录，下载解压会一堆东西）。
      # macOS 的 tauri 产物 = .app 目录 + .dmg；只传 .dmg（双击安装）。
      - name: Upload installers (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: DSH Dock-macOS
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

      # Windows: NSIS 自解压 .exe + MSI
      - name: Upload installers (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: DSH Dock-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14

      # Linux: .deb + .rpm + .AppImage
      - name: Upload installers (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: DSH Dock-Linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14

      # 客户端自更新产物（签名包 + 配对 .sig）：
      # 布局随 bundler 版本/平台变化（.app.tar.gz / .AppImage.sig / *.nsis.zip 等），
      # 统一收「bundle 下全部 .sig + 其签名对象」，交给 release 的 latest.json 脚本
      # 按文件名分类。无签名 key（--no-sign 构建）→ 无 .sig → 空 artifact（warn）。
      - name: Upload updater artifacts (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: DSH Dock-macOS-updater
          path: |
            src-tauri/target/release/bundle/**/*.sig
            src-tauri/target/release/bundle/macos/*.app.tar.gz
          if-no-files-found: warn
          retention-days: 14

      - name: Upload updater artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: DSH Dock-Windows-updater
          path: |
            src-tauri/target/release/bundle/**/*.sig
            src-tauri/target/release/bundle/**/*.zip
          if-no-files-found: warn
          retention-days: 14

      - name: Upload updater artifacts (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: DSH Dock-Linux-updater
          path: |
            src-tauri/target/release/bundle/**/*.sig
            src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn
          retention-days: 14

  # tag v* 时把三平台安装器聚合成一个 GitHub Release（发布态）。
  # 单 job（无矩阵）：下载三平台 artifact 合并后一次创建 Release——
  # 多 job 并发对同一 tag create 会冲突（403/422）。
  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download macOS installers
        uses: actions/download-artifact@v4
        with:
          name: DSH Dock-macOS
          path: installers/macos

      - name: Download Windows installers
        uses: actions/download-artifact@v4
        with:
          name: DSH Dock-Windows
          path: installers/windows

      - name: Download Linux installers
        uses: actions/download-artifact@v4
        with:
          name: DSH Dock-Linux
          path: installers/linux

      - name: Download macOS updater artifacts
        uses: actions/download-artifact@v4
        with:
          name: DSH Dock-macOS-updater
          path: updater/macos

      - name: Download Windows updater artifacts
        uses: actions/download-artifact@v4
        with:
          name: DSH Dock-Windows-updater
          path: updater/windows

      - name: Download Linux updater artifacts
        uses: actions/download-artifact@v4
        with:
          name: DSH Dock-Linux-updater
          path: updater/linux

      - name: List installers
        run: find installers -type f | sort; echo ---; find updater -type f | sort || true

      # 先创建 Release 并上传安装器 + updater 产物（latest.json 需要 Release 已
      # 存在才能查 API 拿真实 asset 名——先捏后查，避免 404 chicken-egg）。
      - name: Create GitHub Release (installers + updater)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: false
          # updater 产物必须一并上传：latest.json 里每个平台的 url 都指向
          # Release 里同名文件（签名对象本体：.app.tar.gz / .exe / .msi /
          # .AppImage），漏传 = 更新下载 404（2026-08-25 实测踩坑）。
          files: |
            installers/**/*
            updater/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 生成 latest.json（桌面客户端自更新清单）：
      # 从「签名过的 updater 产物」聚合 `platforms: {os-arch: {url, signature}}`。
      # URL 必须指向 Release 里的**实际 asset 名**（softprops 上传时把空格规范成
      # 点号：DSH Dock_... → DSH.Dock_...），所以用 GitHub API 列出该 tag 的
      # assets 做精确映射，不猜文件名。
      # 平台键识别（按签名对象扩展名 + 文件名特征）：
      #   *.app.tar.gz(.sig)   → darwin-aarch64
      #   *setup.exe(.sig)     → windows-x86_64-nsis
      #   *.msi(.sig)          → windows-x86_64-msi
      #   *.AppImage(.sig)     → linux-x86_64-appimage
      - name: Generate latest.json
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          from urllib.parse import quote
          repo = "realguan/dsh-dock"
          tag = os.environ.get("VERSION", "").lstrip("v")
          # ① 列该 tag 的 Release assets（真实名 + 下载 URL）——Release 已创建
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/releases/tags/v{tag}",
              headers={"Accept": "application/vnd.github+json"},
          )
          rel = json.load(urllib.request.urlopen(req))
          assets = {a["name"]: a["browser_download_url"] for a in rel["assets"]}
          print("Release assets:", list(assets.keys()))
          # ② 读签名文件（updater 产物目录）
          root = "updater"
          sigmap = {}  # 原始 basename(去.sig) -> sig content
          for dp, dn, fn in os.walk(root):
              for f in fn:
                  if f.endswith(".sig"):
                      sigmap[f[:-4]] = open(os.path.join(dp, f)).read().strip()
          # ③ 平台键 → (签名内容, release asset 名)
          #    用「签名对象的规范化名（空格→点号）」在 assets 里找真实名。
          def norm(name):
              return name.replace(" ", ".")
          platforms = {}
          for orig, sig in sigmap.items():
              low = orig.lower()
              if low.endswith(".app.tar.gz"):
                  key = "darwin-aarch64" if "universal" not in low else "darwin-universal"
              elif low.endswith(".appimage"):
                  key = "linux-x86_64-appimage"
              elif low.endswith(".msi"):
                  key = "windows-x86_64-msi"
              elif low.endswith(".setup.exe") or ("setup" in low and low.endswith(".exe")):
                  key = "windows-x86_64-nsis"
              else:
                  continue
              target = norm(orig)
              url = assets.get(target)
              if not url:
                  print(f"  !! 找不到 release asset: {target}")
                  continue
              platforms[key] = {"url": url, "signature": sig}
              print(f"  {key} <- {target}")
          if not platforms:
              print("NO UPDATER ASSETS FOUND — skipping latest.json")
              raise SystemExit(0)
          # pub_date 必须是合法 RFC3339（插件解析失败会整个反序列化崩掉）。
          from datetime import datetime, timezone
          pub_date = datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")
          latest = {
              "version": os.environ.get("VERSION", "0.0.0"),
              "notes": "DSH Dock " + os.environ.get("VERSION", ""),
              "pub_date": pub_date,
              "platforms": platforms,
          }
          with open("latest.json", "w") as fh:
              json.dump(latest, fh, ensure_ascii=False, indent=2)
          print("latest.json:")
          print(open("latest.json").read())
          PY
        env:
          VERSION: ${{ github.ref_name }}

      # latest.json 生成后补传（软更新清单必须是最新资产映射）
      - name: Upload latest.json to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}