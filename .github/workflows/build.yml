# 跨平台桌面客户端构建（DSH Dock）
#
# 两段式：
# 1) push / PR / 手动 → 三平台矩阵构建验证 + artifact 上传（开发态）
# 2) tag v* → 同一矩阵构建 + 聚合为 GitHub Release（发布态）
#
# 默认壳：本仓库 resources/product.manifest.json（极简档：system → download，
# 不携带快照；见 docs/contract.md）。产物为自解压安装包 / .app / .dmg / .deb。
name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  TAURI_CLI_VERSION: "2.8.4"

# release job 需要创建 GitHub Release → GITHUB_TOKEN 显式授 contents: write
permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Tauri v2 官方要求的系统依赖（Linux 构建安装包必需）
      - name: Ubuntu system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      # 【签名已暂停（2026-08-25）】macOS 签名/公证步骤整体移除——
      # CI 先保证三平台构建稳定通过。tauri.conf signingIdentity 默认 "-"（ad-hoc），
      # 本机可跑、分发会被 Gatekeeper 拦。恢复签名时重新启用：
      #   1. Import signing certificate（APPLE_CERTIFICATE / PASSWORD base64 导入 keychain）
      #   2. Write API key file（~/private_keys/AuthKey_<KEY_ID>.p8）
      #   3. Build 时 --config 覆盖 signingIdentity + 注入 APPLE_API_KEY_* env（tauri 自动 notarize+staple）
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "${{ env.TAURI_CLI_VERSION }}" --locked

      - name: Unit tests
        working-directory: src-tauri
        run: cargo test

      - name: Build installers
        working-directory: src-tauri
        run: cargo tauri build

      # 只上传安装器「文件」(.dmg/.exe/.msi/.deb/.rpm/.AppImage)——
      # 不打包整个 bundle 目录（含 .app 应用目录，下载解压会一堆东西）。
      # macOS 的 tauri 产物 = .app 目录 + .dmg；只传 .dmg（双击安装）。
      - name: Upload installers (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: DSH Dock-macOS
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

      # Windows: NSIS 自解压 .exe + MSI
      - name: Upload installers (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: DSH Dock-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14

      # Linux: .deb + .rpm + .AppImage
      - name: Upload installers (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: DSH Dock-Linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14

  # tag v* 时把三平台安装器聚合成一个 GitHub Release（发布态）。
  # 单 job（无矩阵）：下载三平台 artifact 合并后一次创建 Release——
  # 多 job 并发对同一 tag create 会冲突（403/422）。
  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download macOS installers
        uses: actions/download-artifact@v4
        with:
          name: DSH Dock-macOS
          path: installers/macos

      - name: Download Windows installers
        uses: actions/download-artifact@v4
        with:
          name: DSH Dock-Windows
          path: installers/windows

      - name: Download Linux installers
        uses: actions/download-artifact@v4
        with:
          name: DSH Dock-Linux
          path: installers/linux

      - name: List installers
        run: find installers -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: false
          files: installers/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}