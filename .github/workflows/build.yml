# 跨平台桌面客户端构建（DSH Dock）
#
# 两段式：
# 1) push / PR / 手动 → 三平台矩阵构建验证 + artifact 上传（开发态）
# 2) tag v* → 同一矩阵构建 + 聚合为 GitHub Release（发布态）
#
# 默认壳：本仓库 resources/product.manifest.json（v3 引擎档缺省：壳自管
# node/pnpm/dsh，不携带快照；见 docs/contract.md）。产物为自解压安装包 / .app / .dmg / .deb。
name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# PR 或同一分支连续推送时，旧构建没有继续占用三平台 runner 的价值；tag 发布绝不
# 自动取消，避免中断签名/上传中的正式发行。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  # tauri-cli 必须与 tauri crate（2.11.x）同代：cli 2.8.4 的 bundler 对
  # createUpdaterArtifacts 的产物布局/二进制补丁与 2.11 不一致（CI 实测
  # __TAURI_BUNDLE_TYPE 补丁失败 + Linux updater 签名形态不同）。
  TAURI_CLI_VERSION: "2.11.4"

# 默认只读；唯一需要写 Release 的 job 单独提升权限，PR 构建不持有写 token。
permissions:
  contents: read

jobs:
  build:
    # `matrix.name` 而非 `matrix.os`：macOS 有两个 leg（arm64 / x86_64）跑在同一
    # runner 镜像上，必须有可区分的 job 名。**既有三个 leg 的 name 与旧值逐字相同**
    # （macos-latest / windows-latest / ubuntu-latest），避免改名影响分支保护里
    # 既有的必需检查；新 leg 才引入新名字。
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        # 每个 leg 显式列全所有键——不依赖「未设置的 matrix 键求值为空」这类隐式
        # 行为（新增 leg 时漏键会让 condition 静默走错分支）。
        #
        # macOS x86_64 leg（2026-09-11，Intel Mac 支持）：
        #   `macos-latest` 现为 arm64 runner，Intel 产物由**交叉构建**得到
        #   （`--target x86_64-apple-darwin`）。不用 `macos-13`——那是 Intel
        #   runner，GitHub 已在退役流程中，长期不可依赖。
        #   本机已实测：交叉构建可产出可用的 `..._x64.dmg`（Mach-O x86_64）。
        #
        # 资源约束（本机实测，不是推测）：Tauri 把 `resources/` **整目录**塞进
        #   .app，故每个 macOS leg 只能 fetch 自己那一份 pnpm tgz——否则包里会
        #   多背另两份（实测 54MB，应约 19MB）。见下方 fetch 步骤。
        include:
          - name: macos-latest
            os: macos-latest
            rust_target: aarch64-apple-darwin
            pnpm_platform: darwin-arm64
            asset_arch: aarch64
            artifact_suffix: ""
            native_arch: true
          - name: macos-latest-x86_64
            os: macos-latest
            rust_target: x86_64-apple-darwin
            pnpm_platform: darwin-x64
            asset_arch: x86_64
            artifact_suffix: "-x86_64"
            native_arch: false
          - name: windows-latest
            os: windows-latest
            rust_target: ""
            pnpm_platform: ""
            asset_arch: ""
            artifact_suffix: ""
            native_arch: true
          - name: ubuntu-latest
            os: ubuntu-latest
            rust_target: ""
            pnpm_platform: ""
            asset_arch: ""
            artifact_suffix: ""
            native_arch: true
    runs-on: ${{ matrix.os }}
    steps:
      # 固定到完整 commit SHA，供应链更新由 Dependabot 提交可审查 PR。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 版本号一致性防呆闸门（2026-08-31）：
      # 当由 tag（如 v0.8.7）触发构建时，强制校验 git tag 剥除 'v' 前缀后必须与
      # Cargo.toml、tauri.conf.json、frontend/package.json 中的版本号完全一致！
      # 彻底杜绝「打了个新 tag 但源码版本号仍是旧版本」导致客户端内部版本漂移事故。
      - name: Verify tag version consistency
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && runner.os == 'Linux'
        shell: bash
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          # 预发布 tag（v0.9.4-rc.1 等）允许试构建：取主版本段比对（2026-09-04，
          # 证书轮换试跑引入）；正式发版 tag 无连字符，行为与原先完全一致。
          BASE_VER="${TAG_VER%%-*}"
          echo "Checking tag version: $TAG_VER (base: $BASE_VER)"
          CARGO_VER=$(grep -E '^version = ' src-tauri/Cargo.toml | head -1 | sed -E 's/version = "([^"]+)"/\1/')
          TAURI_VER=$(grep -E '"version": ' src-tauri/tauri.conf.json | head -1 | sed -E 's/.*"version": "([^"]+)".*/\1/')
          PKG_VER=$(grep -E '"version": ' frontend/package.json | head -1 | sed -E 's/.*"version": "([^"]+)".*/\1/')
          echo "Cargo.toml:        $CARGO_VER"
          echo "tauri.conf.json:   $TAURI_VER"
          echo "package.json:      $PKG_VER"
          if [ "$BASE_VER" != "$CARGO_VER" ] || [ "$BASE_VER" != "$TAURI_VER" ] || [ "$BASE_VER" != "$PKG_VER" ]; then
            echo "::error::Tag 版本 ($TAG_VER) 与代码内版本号不匹配！(Cargo: $CARGO_VER, Tauri: $TAURI_VER, Pkg: $PKG_VER)"
            exit 1
          fi
          echo "✅ Tag 版本与代码内所有版本定义完全一致"

          # 发布日志文档门禁（2026-09-09 裁定，AGENTS.md §8.8）：发版必须在 docs/RELEASE_NOTES.md
          # 中提供当前 tag 对应的发布说明，杜绝漏写导致静默降级为内部广播或裸 git log。
          if ! grep -qE "^## \[v?${BASE_VER}\]" docs/RELEASE_NOTES.md; then
            echo "::error::docs/RELEASE_NOTES.md 中缺少版本 [v${BASE_VER}] 的发布说明！请先按 docs/prompts/release-notes.md 编写发布日志后再打 tag 发版。"
            exit 1
          fi
          echo "✅ docs/RELEASE_NOTES.md 包含当前版本发布说明"

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      # **非宿主架构 leg 必须显式装 std**（2026-09-11，独立验证发现）：
      # `macos-latest` = **arm64** runner，而 rustup 只装宿主架构的 std
      # （action 实跑 `rustup toolchain install stable --profile minimal`，
      # `--profile minimal` = rustc + **仅宿主** rust-std + cargo，且全仓无
      # `rustup target add`）。rustup **不会**在缺 target 时自动补装。
      # ⇒ 交叉 leg 若不装，会在第一个消费 target 的步骤（clippy）直接
      # `error[E0463]: can't find crate for 'std'` 而红，Intel 产物根本不会产出。
      # arm64 leg 不受影响（`--target aarch64-apple-darwin` = 宿主本身），
      # **正因如此该缺陷极易漏掉**——两个 macOS leg 看着像同一回事。
      # 本机之所以"能跑"，是因为本机早就手动装过该 target；CI runner 是干净的。
      # 不传 action 的 `targets:`（Windows/Linux leg 的 rust_target 为空串，
      # 避免依赖 action 对空串的解释），改用显式一步，零歧义。
      - name: Install Rust target std (non-host arch legs only)
        if: matrix.rust_target != ''
        run: rustup target add ${{ matrix.rust_target }}

      # Tauri v2 官方要求的系统依赖（Linux 构建安装包必需）
      - name: Ubuntu system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "${{ env.TAURI_CLI_VERSION }}" --locked

      # 引擎档依赖（ADR-0010 边界 A，contract v3）：pnpm 平台二进制压缩包入
      # resources/pnpm/，随安装包分发（engine_pnpm_bundle 契约）；镜像链 +
      # shasum 完整性校验。三平台各自取本平台份；Windows 另取 linux-x64 份
      # （WSL 客体投递，guest_pnpm_bundle 契约，ADR-0010 台账）。
      # **macOS 必须显式指定份**：x86_64 leg 跑在 arm64 runner 上，无参调用会取到
      # darwin-arm64（错份）。且 Tauri 把 resources/ 整目录塞进 .app ⇒ 多取的份会
      # 直接增大安装包（本机实测 54MB vs 约 19MB）。
      # 必须先于一切 cargo 编译步骤——build.rs 的 tauri-build 会 glob 校验
      # resources/pnpm/**/*，检出里无 tgz 直接 panic（2026-09-07 实证）。
      - name: Fetch bundled pnpm binary (engine bootstrap)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            scripts/fetch-pnpm-bundle.sh win32-x64 linux-x64
          elif [ -n "${{ matrix.pnpm_platform }}" ]; then
            scripts/fetch-pnpm-bundle.sh "${{ matrix.pnpm_platform }}"
          else
            scripts/fetch-pnpm-bundle.sh
          fi

      # Rust 质量闸门：fmt 是全局一致的格式契约，只需 Linux 一次；clippy/test
      # 仍按 leg 执行，覆盖 #[cfg] 分叉（如 Windows spawn / unix 信号）与**目标
      # 架构**分叉（macOS 两个 leg 各自的目标三元组）。
      - name: Rust fmt gate
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: cargo fmt --check

      # macOS leg 显式带 `--target`：arm64 上 `--target aarch64-apple-darwin` 与
      # 不加等价（行为不变），x86_64 leg 才真正 lint Intel 目标。Windows/Linux
      # 的 rust_target 为空 ⇒ 命令与旧版逐字相同。
      - name: Rust clippy gate
        working-directory: src-tauri
        run: cargo clippy ${{ matrix.rust_target != '' && format('--target {0}', matrix.rust_target) || '' }} --all-targets -- -D warnings

      - name: Unit tests
        if: matrix.native_arch
        working-directory: src-tauri
        # DSH_TEST_REQUIRE_NODE=1（2026-09-08，架构评审批次 5）：sessions 的修复链用例
        # 依赖 PATH 上的 node 真跑；缺 node 时本地允许跳过，CI 必须硬失败——
        # 否则「静默 0 断言」会让红灯不亮、绿灯失真。
        env:
          DSH_TEST_REQUIRE_NODE: "1"
        run: cargo test ${{ matrix.rust_target != '' && format('--target {0}', matrix.rust_target) || '' }}

      # 非原生架构 leg（macOS x86_64）：在 arm64 runner 上**运行** x86_64 测试
      # 二进制依赖 Rosetta（不保证预装）⇒ 改为只编译不执行。编译本身即有效证据
      # ——目标架构下生产码与测试码都能过编译；执行面由原生 leg 覆盖。
      - name: Compile tests for target arch (no run)
        if: matrix.native_arch == false
        working-directory: src-tauri
        env:
          DSH_TEST_REQUIRE_NODE: "1"
        run: cargo test --no-run --target ${{ matrix.rust_target }}

      # 前端构建（2026-08-27 前端迁移，ADR-0008；2026-09-04 切 pnpm 12）：beforeBuildCommand 钩子会跑
      # pnpm install --frozen-lockfile && pnpm run build；锁文件 = frontend/pnpm-lock.yaml（node 22 LTS）。
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "12.3.1"

      - name: Setup node for frontend
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # 前端质量闸门（typecheck/lint/vitest，frontend-migration §6）。
      # 它们是平台无关的纯逻辑检查，只在 Linux 跑一次；三平台仍保留 clippy/test/package。
      - name: Frontend gates
        if: runner.os == 'Linux'
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run typecheck
          pnpm run lint
          pnpm run test

      # 发布 feed 的资产映射是纯 Python 标准库逻辑；在普通 CI 提前回归，而不是等
      # tag 构建走到发布阶段才发现某个平台无法自更新。
      - name: Release helper tests
        if: runner.os == 'Linux'
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v

      # 私钥只注入 tag 构建步骤，绝不写入 GITHUB_ENV；因此 PR 的 cargo/npm 命令
      # 无法读取发布密钥。tag 必须签名，缺密钥直接失败而非发布不可更新的安装器。
      - name: Build signed installers (macOS)
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && runner.os == 'macOS'
        shell: bash
        working-directory: .
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || {
            echo "::error::tag 发布必须配置 TAURI_SIGNING_PRIVATE_KEY"
            exit 1
          }

          has_apple_credentials=false
          if [[ -n "$APPLE_CERTIFICATE" || -n "$APPLE_CERTIFICATE_PASSWORD" || -n "$APPLE_API_KEY_CONTENT" || -n "$APPLE_API_KEY_ID" || -n "$APPLE_API_ISSUER" ]]; then
            has_apple_credentials=true
            for required in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_API_KEY_CONTENT APPLE_API_KEY_ID APPLE_API_ISSUER; do
              test -n "${!required}" || {
                echo "::error::macOS 签名/公证配置不完整：缺少 $required"
                exit 1
              }
            done
            key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
            umask 077
            printf '%s' "$APPLE_API_KEY_CONTENT" > "$key_path"
            trap 'rm -f "$key_path"' EXIT
            # Tauri 读取 APPLE_API_KEY 作为 key id，p8 内容仅短暂落入 runner 临时目录。
            export APPLE_API_KEY="$APPLE_API_KEY_ID"
            export APPLE_API_KEY_PATH="$key_path"

            # 动态推导证书 Common Name（优先从 APPLE_CERTIFICATE 提取，否则回退默认值）
            cert_cn=""
            if [[ -n "$APPLE_CERTIFICATE" && -n "$APPLE_CERTIFICATE_PASSWORD" ]]; then
              echo "$APPLE_CERTIFICATE" | base64 --decode > /tmp/cert_detect.p12 2>/dev/null || echo "$APPLE_CERTIFICATE" | base64 -D > /tmp/cert_detect.p12 2>/dev/null || true
              if [[ -f /tmp/cert_detect.p12 ]]; then
                cert_cn=$(openssl pkcs12 -in /tmp/cert_detect.p12 -passin "pass:$APPLE_CERTIFICATE_PASSWORD" -nokeys 2>/dev/null | openssl x509 -noout -subject 2>/dev/null | sed -n 's/.*CN[ =]*//p' | cut -d',' -f1 | head -n1 || true)
              if [[ -z "$cert_cn" ]]; then
                cert_cn=$(openssl pkcs12 -legacy -in /tmp/cert_detect.p12 -passin "pass:$APPLE_CERTIFICATE_PASSWORD" -nokeys 2>/dev/null | openssl x509 -noout -subject 2>/dev/null | sed -n 's/.*CN[ =]*//p' | cut -d',' -f1 | head -n1 || true)
              fi
                rm -f /tmp/cert_detect.p12
              fi
            fi
            if [[ -z "$cert_cn" ]]; then
              cert_cn="${APPLE_SIGNING_IDENTITY:-Apple Development: zgg1224@qq.com (65GDLKG7AH)}"
            fi
            echo "::notice::macOS 代码签名 Identity: $cert_cn"
            export APPLE_SIGNING_IDENTITY="$cert_cn"
          else
            # 未配置的 GitHub secret 会以空字符串出现在 env；Tauri 将空值视为
            # 已设置，必须清掉才能按 tauri.conf 的 '-' 回退到 ad-hoc 签名。
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY
            unset APPLE_API_KEY_CONTENT APPLE_API_KEY_ID APPLE_API_ISSUER
            unset APPLE_API_KEY APPLE_API_KEY_PATH
            echo "::warning::未配置 Apple 签名凭据，macOS 产物仅 ad-hoc 签名，不能作为公开分发包"
          fi

          # 公证合规（v0.9.5 发版实证，ADR-0010 spike 发版验收清单项）：notaryd
          # 会递归解包 tgz/tar，要求内嵌 Mach-O 具备 Developer ID 签名 + 安全
          # 时间戳 + hardened runtime——捆绑 pnpm（npmmirror 原包未签名）三连拒
          # 即公证 Invalid。打包前解包重签回填（成员路径不变，运行时 tar -xzf
          # 消费无感；win/linux tgz 含 PE/ELF 不在公证范围）。tauri 自身的证书
          # 导入发生在其 bundler 内部，此处重签须自备临时 keychain。
          # **按 leg 平台份**（2026-09-11）：Intel leg 重签的是 darwin-x64 那份；
          # 硬编码 arm64 会让 Intel 包漏签、公证 Invalid。
          PNPM_TGZ="src-tauri/resources/pnpm/${{ matrix.pnpm_platform }}.tgz"
          if [ -f "$PNPM_TGZ" ] && [ -n "${APPLE_CERTIFICATE:-}" ] && [ -n "${APPLE_SIGNING_IDENTITY:-}" ]; then
            SIGN_TMP=$(mktemp -d)
            KEYCHAIN="$SIGN_TMP/sign.keychain-db"
            KEYCHAIN_PASS=$(openssl rand -hex 16)
            DEFAULT_KCS=$(security list-keychains -d user | tr -d '"' | tr '\n' ' ')
            security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
            security set-keychain-settings -lut 21600 "$KEYCHAIN"
            printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$SIGN_TMP/cert.p12" 2>/dev/null \
              || printf '%s' "$APPLE_CERTIFICATE" | base64 -D > "$SIGN_TMP/cert.p12"
            security import "$SIGN_TMP/cert.p12" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASS" "$KEYCHAIN" > /dev/null
            security list-keychains -d user -s "$KEYCHAIN" $DEFAULT_KCS
            tar -xzf "$PNPM_TGZ" -C "$SIGN_TMP"
            codesign --force --options runtime --timestamp \
              --sign "$APPLE_SIGNING_IDENTITY" "$SIGN_TMP/package/pnpm"
            codesign --verify --strict "$SIGN_TMP/package/pnpm"
            tar -czf "$PNPM_TGZ" -C "$SIGN_TMP" package
            security list-keychains -d user -s $DEFAULT_KCS
            security delete-keychain "$KEYCHAIN" 2>/dev/null || true
            rm -rf "$SIGN_TMP"
            echo "::notice::捆绑 pnpm 已重签（Developer ID + hardened runtime + timestamp）"
          fi

          cargo tauri build --target "${{ matrix.rust_target }}"

          if [[ "$has_apple_credentials" == true ]]; then
            app_path=$(find "src-tauri/target/${{ matrix.rust_target }}/release/bundle/macos" -maxdepth 1 -type d -name '*.app' -print -quit)
            test -n "$app_path" || {
              echo "::error::未找到 macOS .app 产物"
              exit 1
            }
            codesign --verify --deep --strict --verbose=2 "$app_path"
            spctl --assess --type execute --verbose=4 "$app_path" || echo "::warning::Gatekeeper spctl 评估未通过（开发证书或未完成公证缓存属预期）"
          fi

      - name: Build signed installers (Windows/Linux)
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && runner.os != 'macOS'
        shell: bash
        working-directory: .
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          set -euo pipefail
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || {
            echo "::error::tag 发布必须配置 TAURI_SIGNING_PRIVATE_KEY"
            exit 1
          }
          cargo tauri build

      # 2026-08-27 前端迁移：tauri-cli 跑 hook 前会把进程 cwd 切到 src-tauri；
      # tauri.conf.json 已显式配置 frontend cwd，不能依赖 package.json 自动发现。
      - name: Build unsigned installers (PR/branch)
        if: github.ref_type != 'tag' || startsWith(github.ref_name, 'v') == false
        shell: bash
        working-directory: .
        run: |
          if [ -n "${{ matrix.rust_target }}" ]; then
            cargo tauri build --no-sign --target "${{ matrix.rust_target }}"
          else
            cargo tauri build --no-sign
          fi

      # Tauri 对 updater tarball 的默认名**不含架构**（`DSH Dock.app.tar.gz`）：
      # 两个 macOS leg 会产出**同名文件** ⇒ Release 资产重名（生成脚本会拒绝）且
      # download-artifact 相互覆盖。此处按架构打标，使
      # `scripts/generate-latest-json.py` 能把 `.app.tar.gz` 精确映射到
      # darwin-aarch64 / darwin-x86_64（该脚本刻意不给默认架构——见其注释）。
      # 重命名不影响签名：签名对象是 tarball **内容**，`.sig` 随之改名即可。
      # 非 tag 构建走 `--no-sign`，无 .sig，故对签名文件的存在与否容错。
      - name: Tag macOS updater artifact with architecture
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          dir="src-tauri/target/${{ matrix.rust_target }}/release/bundle/macos"
          test -d "$dir" || { echo "::error::未找到 macOS bundle 目录：$dir"; exit 1; }
          shopt -s nullglob
          tarballs=("$dir"/*.app.tar.gz)
          test "${#tarballs[@]}" -gt 0 || { echo "::error::$dir 下无 .app.tar.gz 产物"; exit 1; }
          for f in "${tarballs[@]}"; do
            base="${f%.app.tar.gz}"
            mv "$f" "${base}_${{ matrix.asset_arch }}.app.tar.gz"
            if [ -f "$f.sig" ]; then
              mv "$f.sig" "${base}_${{ matrix.asset_arch }}.app.tar.gz.sig"
            fi
          done
          echo "已按架构打标："
          find "$dir" -maxdepth 1 -type f | sort

      # 诊断：打印 bundle 产物布局（updater 文件真实路径靠日志定，不靠猜）。
      - name: List bundle outputs
        shell: bash
        working-directory: src-tauri
        run: |
          # macOS leg 显式带 --target ⇒ 产物在 target/<triple>/release/bundle 下；
          # Windows/Linux 无 target ⇒ 仍是 target/release/bundle（路径不变）。
          if [ -n "${{ matrix.rust_target }}" ]; then
            find "target/${{ matrix.rust_target }}/release/bundle" -type f | sort
          else
            find target/release/bundle -type f | sort
          fi

      # 只上传安装器「文件」(.dmg/.exe/.msi/.deb/.rpm/.AppImage)——
      # 不打包整个 bundle 目录（含 .app 应用目录，下载解压会一堆东西）。
      # macOS 的 tauri 产物 = .app 目录 + .dmg；只传 .dmg（双击安装）。
      - name: Upload installers (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DSH Dock-macOS${{ matrix.artifact_suffix }}
          path: |
            src-tauri/target/${{ matrix.rust_target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      # Windows: NSIS 自解压 .exe + MSI
      - name: Upload installers (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DSH Dock-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      # Linux: .deb + .rpm + .AppImage
      - name: Upload installers (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DSH Dock-Linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      # updater artifact 仅由 tag 签名构建产生，缺失即发行失败。Linux AppImage 已在
      # installers artifact 中，无需再传一次大文件；feed 用签名关联该原始资产。
      - name: Upload updater artifacts (macOS)
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && runner.os == 'macOS'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DSH Dock-macOS${{ matrix.artifact_suffix }}-updater
          path: |
            src-tauri/target/${{ matrix.rust_target }}/release/bundle/**/*.sig
            src-tauri/target/${{ matrix.rust_target }}/release/bundle/macos/*.app.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Upload updater artifacts (Windows)
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DSH Dock-Windows-updater
          path: |
            src-tauri/target/release/bundle/**/*.sig
            src-tauri/target/release/bundle/**/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload updater artifacts (Linux)
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DSH Dock-Linux-updater
          path: |
            src-tauri/target/release/bundle/**/*.sig
          if-no-files-found: error
          retention-days: 14

  # 覆盖率基线（roadmap 4.1，2026-08-27）：先出数不定阈值（宪法 §5 [待补充] 收口）。
  # 单 job ubuntu 即可——覆盖率反映测试对逻辑的覆盖，不随平台显著变化；
  # 与 build 矩阵并行，不阻塞产物构建。tag 的 build 矩阵已执行测试；coverage 不作为
  # 发布前置，避免再跑一份带插桩的相同测试集。
  coverage:
    if: github.ref_type != 'tag'
    name: coverage (baseline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      # 与 build 矩阵相同的系统依赖（壳 lib 依赖 tauri，编译即需要 webkit2gtk）。
      - name: Ubuntu system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      # build.rs 的 tauri-build glob 校验 resources/pnpm/**/*（同 build 矩阵根因）
      - name: Fetch bundled pnpm binary (engine bootstrap)
        shell: bash
        run: scripts/fetch-pnpm-bundle.sh

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@7b8d4719ee4aaa279bdf55df38dacb9ebfe12a6c # v2.87.6
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage
        working-directory: src-tauri
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov
          path: src-tauri/lcov.info
          retention-days: 14

  # tag v* 时把三平台安装器聚合成一个 GitHub Release（发布态）。
  # 单 job（无矩阵）：下载三平台 artifact 合并后一次创建 Release——
  # 多 job 并发对同一 tag create 会冲突（403/422）。
  release:
    name: release
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download macOS installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: DSH Dock-macOS
          path: installers/macos

      # Intel Mac 产物（2026-09-11）：与 arm64 分 leg 构建，资产名不同 ⇒ 不覆盖。
      # 两份 updater 签名进同一目录不冲突：tarball 已按架构打标（见上）。
      - name: Download macOS x86_64 installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: DSH Dock-macOS-x86_64
          path: installers/macos-x86_64

      - name: Download Windows installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: DSH Dock-Windows
          path: installers/windows

      - name: Download Linux installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: DSH Dock-Linux
          path: installers/linux

      - name: Download macOS updater artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: DSH Dock-macOS-updater
          path: updater/macos

      - name: Download macOS x86_64 updater artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: DSH Dock-macOS-x86_64-updater
          path: updater/macos-x86_64

      - name: Download Windows updater artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: DSH Dock-Windows-updater
          path: updater/windows

      - name: Download Linux updater artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: DSH Dock-Linux-updater
          path: updater/linux

      - name: List installers
        shell: bash
        run: |
          find installers -type f | sort
          find updater -type f | sort

      # 提取当前版本的详细发布日志（严格从 docs/RELEASE_NOTES.md 提取权威变更小节，AGENTS.md §8.8）
      - name: Extract Release Notes
        shell: bash
        run: |
          python3 scripts/extract-release-notes.py "${{ github.ref_name }}" release_notes.md --strict

      # 已公开的 Release 不允许被重跑任务替换资产；草稿可安全续跑，直到 feed 校验
      # 完整后才发布。这样 /releases/latest 不会短暂指向一个没有 latest.json 的版本。
      - name: Refuse to mutate a published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # /releases/tags/{tag} 对 draft release 一律 404（2026-09-04 实测），
          # 必须走列表按 tag_name 过滤才能识别草稿；列表按最新在前排序。
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=50" > releases-all.json
          state=$(python3 - <<'PY'
          import json, os

          tag = os.environ["GITHUB_REF_NAME"]
          match = [r for r in json.load(open("releases-all.json")) if r["tag_name"] == tag]
          if not match:
              print("absent")
          elif match[0]["draft"]:
              print("draft")
          else:
              print("published")
          PY
          )
          case "$state" in
            published)
              echo "::error::Release ${GITHUB_REF_NAME} 已公开；拒绝覆盖已发行资产"
              exit 1
              ;;
            draft) echo "继续已有草稿 Release ${GITHUB_REF_NAME}" ;;
            absent) echo "尚无 Release，将创建草稿" ;;
          esac

      # 草稿先吸收安装器和签名，generator 可据 API 资产清单断言每个 updater 目标都
      # 有对应二进制。draft 的临时 URL 不会写入 feed，脚本会构造正式 tag URL。
      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          body_path: release_notes.md
          draft: true
          fail_on_unmatched_files: true
          files: |
            installers/**/*
            updater/**/*
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Fetch draft release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 同上：draft 不能走 /releases/tags/{tag}（404），列表过滤取本 tag
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=50" > releases-all.json
          python3 - <<'PY'
          import json, os

          tag = os.environ["GITHUB_REF_NAME"]
          match = [r for r in json.load(open("releases-all.json")) if r["tag_name"] == tag]
          if not match:
              raise SystemExit(f"未找到 tag {tag} 对应的 Release（含草稿）")
          json.dump(match[0], open("release-assets.json", "w"))
          PY

      - name: Generate and validate latest.json
        shell: bash
        run: |
          python3 scripts/generate-latest-json.py \
            --version "${GITHUB_REF_NAME}" \
            --repository "${GITHUB_REPOSITORY}" \
            --tag "${GITHUB_REF_NAME}" \
            --assets-json release-assets.json \
            --updater-root updater \
            --notes release_notes.md \
            --output latest.json

      - name: Upload latest.json to draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" latest.json --clobber

      - name: Publish validated release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "${GITHUB_REF_NAME}" --draft=false
          gh api "repos/${GITHUB_REPOSITORY}/releases/latest" > published-release.json
          python3 - "${GITHUB_REF_NAME}" <<'PY'
          import json
          import sys

          release = json.load(open("published-release.json", encoding="utf-8"))
          expected_tag = sys.argv[1]
          if release["tag_name"] != expected_tag or release["draft"]:
              raise SystemExit(f"发布状态不正确：{release['tag_name']} / draft={release['draft']}")
          if "latest.json" not in {asset["name"] for asset in release["assets"]}:
              raise SystemExit("已发布 Release 缺少 latest.json")
          PY
