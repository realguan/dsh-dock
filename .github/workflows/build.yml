# 跨平台桌面客户端构建（DSH Dock）
#
# 两段式：
# 1) push / PR / 手动 → 三平台矩阵构建验证 + artifact 上传（开发态）
# 2) tag v* → 同一矩阵构建 + 聚合为 GitHub Release（发布态）
#
# 默认壳：本仓库 resources/product.manifest.json（极简档：system → download，
# 不携带快照；见 docs/contract.md）。产物为自解压安装包 / .app / .dmg / .deb。
name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  TAURI_CLI_VERSION: "2.8.4"

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Tauri v2 官方要求的系统依赖（Linux 构建安装包必需）
      - name: Ubuntu system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      # macOS 签名证书导入（Developer ID Application .p12）。
      # secrets 未配置时跳过 → ad-hoc 签名（本机可跑，分发会被 Gatekeeper 拦）。
      - name: Import signing certificate
        if: runner.os == 'macOS' && ${{ secrets.APPLE_CERTIFICATE != '' }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > /tmp/apple-cert.p12
          security create-keychain -p github build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p github build.keychain
          security import /tmp/apple-cert.p12 -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/notarytool
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k github build.keychain
          security find-identity -v build.keychain

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "${{ env.TAURI_CLI_VERSION }}" --locked

      - name: Unit tests
        working-directory: src-tauri
        run: cargo test

      # 公证用 API Key 落盘：tauri 需要 APPLE_API_KEY_PATH 指到含 .p8 内容的文件
      - name: Write API key file (macOS)
        if: runner.os == 'macOS' && ${{ secrets.APPLE_API_KEY != '' }}
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          printf '%s\n' "$APPLE_API_KEY" > "$RUNNER_TEMP/apple-api-key.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/apple-api-key.p8" >> "$GITHUB_ENV"

      # 构建 + 打包。macOS 带签名/公证 env 时，tauri 自动 codesign + notarize + staple：
      #   签名：APPLE_SIGNING_IDENTITY（默认自动取 keychain 中的 Developer ID）
      #   公证：APPLE_API_KEY/PATH/ISSUER/KEY_ID（App Store Connect API）或
      #         APPLE_ID + APPLE_PASSWORD + APPLE_TEAM_ID（应用专用密码）
      - name: Build installers
        working-directory: src-tauri
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: cargo tauri build

      - name: Verify signature (macOS)
        if: runner.os == 'macOS' && ${{ secrets.APPLE_CERTIFICATE != '' }}
        working-directory: src-tauri
        run: |
          codesign --verify --deep --strict --verbose=2 \
            "target/release/bundle/macos/DSH Dock.app"
          spctl --assess --type execute --verbose=4 \
            "target/release/bundle/macos/DSH Dock.app" 2>&1 || echo "(公证票未 stapled 时不通过 spctl，已记录)"

      - name: Upload bundles (CI artifact)
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/*
          if-no-files-found: error
          retention-days: 14

  # tag v* 时把三平台产物聚合成 GitHub Release（发布态）
  release:
    name: release (${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download bundles
        uses: actions/download-artifact@v4
        with:
          name: bundles-${{ matrix.os }}
          path: bundles

      - name: List bundles
        run: find bundles -type f ! -path "*/macos/*.app/*" | sort

      # 只发布「文件型」产物：macOS 的 .dmg、Windows 的 .msi/.exe、Linux 的 .deb/.rpm/.AppImage。
      # .app 是目录（macOS），不能作为 Release asset——需要 .dmg 或先 zip。
      - name: Prepare macOS .app (zip)
        if: matrix.os == 'macos-latest'
        working-directory: bundles/macos
        run: |
          ditto -c -k --keepParent "DSH Dock.app" "DSH Dock.app.zip" || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: false
          files: |
            bundles/dmg/*
            bundles/windows/*
            bundles/deb/*
            bundles/rpm/*
            bundles/appimage/*
            bundles/macos/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}