[package]
name = "dsh-desktop-shell"
version = "0.1.0"
edition = "2021"
description = "Tauri product shell for standalone DeepSeek Harness desktop builds (ADR-0004)"
rust-version = "1.77.2"

[lib]
name = "dsh_desktop_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "dsh-desktop-shell"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
thiserror = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "process"] }
