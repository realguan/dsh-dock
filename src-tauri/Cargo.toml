[package]
name = "dsh-dock"
version = "1.4.0"
edition = "2021"
description = "DSH Dock — Tauri product shell for standalone dsh desktop builds (ADR-0004)"
# 2026-08-27 维护者裁定：不设 rust-version 下限，Rust 工具链跟随最新 stable
# （CI 固定 @stable；曾短暂声明 1.77.2 但被 floor_char_boundary 等新 API 击穿，
#  与其虚假声明不如显式放开）。

[lib]
name = "dsh_dock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
doctest = false

[[bin]]
name = "dsh-dock"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
ed25519-dalek = "2" # node-map 远程映射的 ed25519 验签（仅 verify 路径，体积增量很小）
flate2 = "1"
zip = { version = "=4.2.0", default-features = false, features = ["deflate-flate2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9" # patch 切换（4.4③，ADR-0009 第四次修订）：最小读写面，上游停维护已知，收敛在 set_plugin_disabled 单函数便于后继替换
sha2 = "0.10"
tar = "0.4"
tauri = { version = "2", features = ["tray-icon"] }  # 托盘（非 macOS 常驻更新入口，2026-08-24 裁定）；macOS 走系统菜单栏
tauri-plugin-single-instance = "2" # 单实例：OS 级原语锁，二次启动=唤起已有窗口（无残留锁文件问题）
tauri-plugin-updater = "2" # 桌面客户端自更新（2026-08-25）：检查→下载→安装，多平台
ureq = "2" # 唯一网络面（updates 模块）：阻塞式小客户端，后台线程使用
open = "5" # 系统默认程序打开 URL（外链跳浏览器 + 浏览器开工作台；mac=/usr/bin/open, linux=xdg-open, win=ShellExecuteW）
tracing = "0.1"
tracing-subscriber = "0.3"

[target.'cfg(unix)'.dependencies]
# fs = `nix::fcntl` / `dup2`（ADR-0015 子进程生命周期：登记锁 fd 继承 + 生命线管道）。
# 既有依赖加 feature，不新增 crate。
nix = { version = "0.29", features = ["signal", "process", "fs"] }

# 沉浸式标题栏 vibrancy（ADR-0029）：主窗口 Sidebar 材质毛玻璃。target-gated——
# 仅 macOS 目标启用，Windows/Linux 构建面零变化（feature 本身跨平台存在，为显式
# 起见仍按目标收窄）。tauri 官方文档口径：窗口效果需 macOSPrivateApi。
# 与上方 [dependencies] 的同名条目按「同 crate 同版本 → feature 并集」合并。
[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2", features = ["macos-private-api"] }

# 红绿灯定位（ADR-0029 配套）：裸 msg_send 调 AppKit `standardWindowButton:` +
# `setFrameOrigin:`（Tauri 无此 API，官方 Electron 用 trafficLightPosition x16/y18）。
# objc2 0.6.4 本就在依赖树里（tauri → objc2，Cargo.lock 在册、registry 缓存有源），
# 此处仅把既有传递依赖提升为直接依赖，**不引入新 crate、不新增网络拉取**。
objc2 = "0.6"

# 托盘运行期依赖**前置探测**（2026-09-21，平台审计 A1 / AGENTS §0 红线 3）：
# Linux 上 `tray-icon` 经 `libappindicator-sys` 用 libloading **dlopen** 系统库，
# 四个候选名全失败即 `panic!`（该 crate `src/lib.rs:41,50`）；release 档
# `panic = "abort"` ⇒ **启动即崩**，而 `lib.rs` 的 `if let Err` 与 `catch_unwind`
# 都拦不住 abort。故建托盘前先自己加载一次（见 `ui::check_tray_runtime_libs`）。
# libloading 0.7 本就在依赖树里（libappindicator-sys → libloading，Cargo.lock 在册），
# 同 objc2 先例：仅把既有传递依赖提升为直接依赖，**不引入新 crate、不新增拉取**。
[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.7"

# 壳瘦身（2026-08-21）：release 单二进制最小化。
# 安装包大头是快照载荷（打包侧负责）；壳自身 debug 35MB → release 目标 ~10MB。
[profile.release]
opt-level = "z"        # 体积优先（z > s > 2）
lto = true             # 跨 crate 链接期优化
codegen-units = 1      # 单分块最大化优化
strip = true           # 剥离符号表
panic = "abort"        # 桌面壳无 unwind 需求，进一步缩体
