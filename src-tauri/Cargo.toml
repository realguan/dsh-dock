[package]
name = "dsh-desktop-shell"
version = "0.1.0"
edition = "2021"
description = "Tauri product shell for standalone DeepSeek Harness desktop builds (ADR-0004)"
rust-version = "1.77.2"

[lib]
name = "dsh_desktop_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "dsh-desktop-shell"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tracing = "0.1"
tracing-subscriber = "0.3"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "process"] }

# 壳瘦身（2026-08-21）：release 单二进制最小化。
# 安装包大头是快照载荷（打包侧负责）；壳自身 debug 35MB → release 目标 ~10MB。
[profile.release]
opt-level = "z"        # 体积优先（z > s > 2）
lto = true             # 跨 crate 链接期优化
codegen-units = 1      # 单分块最大化优化
strip = true           # 剥离符号表
panic = "abort"        # 桌面壳无 unwind 需求，进一步缩体
