        </svg>
        <div class="brand">
          <div class="name">DeepSeek Harness</div>
          <div class="sub">DESKTOP TERMINAL · BOOT TELEMETRY</div>
        </div>
        <div class="meta" id="meta">standby</div>
      </header>

      <!-- 版本行：当前宿主 dsh + 后台更新检测（首启自动 + 手动检查） -->
      <div class="updline" id="upd"></div>

      <!-- 五步时间线：环境检测 → 宿主解析 → 启动 dsh → 等待就绪 → 进入工作台 -->
      <section class="timeline" id="timeline"></section>

      <!-- 错误卡（boot:error 事件渲染） -->
      <section id="errorBox"></section>

      <!-- 底部遥测日志带 -->
      <footer class="logstrip empty" id="logstrip"></footer>
    </main>

    <script>
      // 启动遥测台：消费 boot:step / boot:error 事件（Rust 侧发出）。
      // 状态推演规则：收到 N 步 running 时，N 之前所有未定步骤自动判 done
      // （弥补「页面注册监听前错过早期事件」的竞态）。
      const STEPS = [
        [0, "01", "环境检测", "扫描用户环境（PATH · 版本闸 · 平台）"],
        [1, "02", "宿主解析", "解析档位 system → bundle → download"],
        [2, "03", "启动 dsh", "spawn 宿主 dsh（--port 0）"],
        [3, "04", "等待就绪", "从日志解析访问地址（上限 20s）"],
        [4, "05", "进入工作台", "WebView 导航到 dsh Web UI"],
      ];

      const timeline = document.getElementById("timeline");
      const logstrip = document.getElementById("logstrip");
      const errBox = document.getElementById("errorBox");

      // 渲染 5 步骨架
      const stepEls = [];
      STEPS.forEach(([idx, num, name, hint], i) => {
        const el = document.createElement("div");
        el.className = "step";
        el.style.animationDelay = (i * 60) + "ms";
        el.innerHTML =
          `<div class="idx">${num}</div>` +
          `<div class="body"><div class="title"><span class="beacon"></span>` +
          `<span class="st-name">${name}</span></div>` +
          `<div class="detail">${hint}</div></div>`;
        timeline.appendChild(el);
        stepEls.push(el);
      });

      const states = new Array(5).fill("pending");

      function setStep(i, state, detail) {
        if (i < 0 || i > 4) return;
        if (state === "running") {
          // 推演：之前的未定步骤 → done
          for (let k = 0; k < i; k++) {
            if (states[k] === "pending") setStep(k, "done", "");
          }
        }
        states[i] = state;
        const el = stepEls[i];
        el.classList.remove("running", "done", "error");
        if (state !== "pending") el.classList.add(state);
        if (state === "active") el.classList.add("active");
        if (detail) el.querySelector(".detail").textContent = detail;
      }

      function pushLog(line, isErr) {
        const row = document.createElement("div");
        row.className = "row" + (isErr ? " err" : "");
        row.textContent = line;
        logstrip.classList.remove("empty");
        logstrip.prepend(row);
        while (logstrip.children.length > 4) logstrip.removeChild(logstrip.lastChild);
      }

      function renderError(e) {
        const actions = (e.actions || []).map((a) => {
          const label = a === "upgrade" ? "升级 dsh 并重试" : "重试启动";
          return `<button class="${a === "upgrade" ? "primary" : "ghost"}" data-action="${a}">${label}</button>`;
        }).join("");
        errBox.innerHTML =
          `<div class="error-card">` +
          `<div class="e-title">${e.title || "启动失败"}</div>` +
          `<div class="e-detail">${(e.detail || "").replace(/</g, "&lt;")}</div>` +
          (e.suggestion ? `<div class="e-suggest">${e.suggestion}</div>` : "") +
          `<div class="e-actions">${actions}</div>` +
          (e.log ? `<details><summary>原始日志尾部</summary><pre>${e.log.replace(/</g, "&lt;")}</pre></details>` : "") +
          `</div>`;
        errBox.querySelectorAll("button").forEach((btn) => {
          btn.addEventListener("click", () => {
            btn.disabled = true;
            errBox.querySelectorAll("button").forEach((b) => (b.disabled = true));
            pushLog("→ 执行动作：" + btn.dataset.action, false);
            window.__TAURI__.core.invoke("terminal_action", { action: btn.dataset.action }).catch((e2) => {
              pushLog("动作失败：" + (e2 && (e2.message || e2)), true);
            });
          });
        });
      }

      // 事件监听（withGlobalTauri 保证 window.__TAURI__）
      window.__TAURI__.event.listen("boot:step", (ev) => {
        const p = ev.payload;
        setStep(p.step, p.state, p.detail);
        if (p.detail) pushLog("[" + (STEPS[p.step] ? STEPS[p.step][1] : p.step) + "] " + p.detail, p.state === "error");
        const meta = document.getElementById("meta");
        if (meta) {
          const idx = "01234".includes(String(p.step)) ? ["01","02","03","04","05"][p.step] : "?";
          meta.textContent = p.state === "done" ? `step ${idx} ✓` : p.state === "error" ? `step ${idx} ✕` : `step ${idx} · ${p.state}`;
        }
      });

      window.__TAURI__.event.listen("boot:error", (ev) => {
        pushLog("✕ " + (ev.payload.title || "错误"), true);
        renderError(ev.payload);
      });

      // 首帧元信息
      document.getElementById("meta").textContent = "listening…";

      // ---- 版本行 / 更新芯片（get_update_status + boot:update + check_updates）----
      const updEl = document.getElementById("upd");
      function renderUpd(s) {
        if (!updEl) return;
        const ver = s.current ? `dsh ${s.current}` : "dsh 未知";
        let html = `<span class="ver">${ver}</span>`;
        if (s.error) {
          html += `<span class="st">检测失败（网络不可达）</span><button class="chip" id="updCheck">检查</button>`;
        } else if (s.latest && s.newer) {
          html += `<span class="st new">▲ 发现新版 ${s.latest}</span>` +
                  `<button class="chip primary" id="updGo">升级到 ${s.latest}</button>` +
                  `<button class="chip" id="updCheck">检查</button>`;
        } else if (s.latest) {
          html += `<span class="st ok">● 已是最新 ${s.latest}</span><button class="chip" id="updCheck">检查</button>`;
        } else {
          html += `<span class="st">◐ 检测中…</span>`;
        }
        updEl.innerHTML = html;
        const go = document.getElementById("updGo");
        if (go) go.addEventListener("click", () => {
          go.disabled = true; go.textContent = "升级中…";
          window.__TAURI__.core.invoke("terminal_action", { action: "upgrade" }).catch((e) => {
            go.textContent = "升级失败";
          });
        });
        const chk = document.getElementById("updCheck");
        if (chk) chk.addEventListener("click", () => {
          chk.disabled = true; chk.textContent = "检测中…";
          window.__TAURI__.core.invoke("check_updates").catch(() => { chk.disabled = false; chk.textContent = "检查"; });
        });
      }
      window.__TAURI__.core.invoke("get_update_status").then(renderUpd);
      window.__TAURI__.event.listen("boot:update", (ev) => renderUpd(ev.payload));

    </script>
  </body>
</html>
