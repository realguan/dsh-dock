<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <title>DSH Dock</title>
    <link rel="stylesheet" href="assets/app.css" />
  </head>
  <body>
    <div class="topbar">
      <span class="wordmark">DSH DOCK</span>
      <span class="top-actions">
        <span class="vchip" id="vchip"></span>
        <button class="abtbtn" id="wslBtn" title="在 WSL2 发行版内运行 DSH（需 Windows + WSL2）">在 WSL 中打开</button>
        <button class="abtbtn" id="aboutBtn">关于</button>
      </span>
    </div>

    <main class="stage">
      <section class="hero" id="hero">
        <div class="emblem" aria-hidden="true"></div>
        <div class="headline" id="headline">正在启动…</div>
        <div class="subline" id="subline"></div>
        <div class="pulse-bar" id="pulseBar"><div class="pulse-fill"></div></div>
      </section>

      <section class="dl" id="dl" hidden>
        <div class="dl-pct"><span id="dlPct">0</span><span class="unit">%</span></div>
        <div class="dl-bar"><div class="dl-fill" id="dlFill"></div></div>
        <div class="dl-meta">
          <span id="dlBytes">0 MB</span>
          <span class="dim" id="dlSpeed"></span>
          <span class="dim" id="dlEta"></span>
        </div>
      </section>

      <section class="console" id="console">
        <div class="console-head" id="consoleHead">
          <span class="console-label">启动详情</span>
          <span class="console-state" id="consoleState"></span>
        </div>
        <div class="steps" id="steps"></div>
        <section id="errorBox"></section>
      </section>
    </main>

    <script>
      // WSL 仅存在于 Windows（2026-08-26 裁定）：平台能力经 Rust 编译期注入
      // （window.__DSH_PLATFORM__）。非 Windows 顶栏不渲染「在 WSL 中打开」。
      const WSL = !!(window.__DSH_PLATFORM__ && window.__DSH_PLATFORM__.wsl);
      if (!WSL) {
        const w = document.getElementById("wslBtn");
        if (w) w.remove();
      }
      // 启动页：一句人话讲状态，技术细节折叠进「启动详情」。
      // 事件协议：boot:step（0-4 步遥测）/ boot:progress（下载字节进度）/
      // boot:error / boot:update（三维度版本状态：dsh / client / node）。
      const STEPS = [
        ["01", "环境检测", "PATH · 版本闸 · 平台"],
        ["02", "宿主解析", "local：system → bundle → download"],
        ["03", "启动 DSH", "--port 0"],
        ["04", "等待就绪", "解析访问地址（慢速冷启动可稍候）"],
        ["05", "进入工作台", "WebView 导航"],
      ];
      const HEADLINES = ["检查运行环境", "确定启动方式", "启动 DSH", "等待工作台就绪", "即将进入工作台"];

      const headline = document.getElementById("headline");
      const subline = document.getElementById("subline");
      const pulseBar = document.getElementById("pulseBar");
      // 动效规则：页面打开即启动，直到导航进 Web UI；仅「出错」与「下载条接管」时让位。
      let errored = false;
      function syncBars() {
        pulseBar.hidden = errored || !dl.hidden;
      }
      const stepsEl = document.getElementById("steps");
      const dl = document.getElementById("dl");
      const dlPct = document.getElementById("dlPct");
      const dlFill = document.getElementById("dlFill");
      const dlBytes = document.getElementById("dlBytes");
      const dlSpeed = document.getElementById("dlSpeed");
      const dlEta = document.getElementById("dlEta");

      const states = new Array(5).fill("pending");
      const stepEls = STEPS.map(([no, name, hint]) => {
        const el = document.createElement("div");
        el.className = "tstep pending";
        el.innerHTML = `<span class="no">${no}</span>` +
          `<span class="what"><span class="name">${name}</span><span class="tinfo">${hint}</span></span>`;
        stepsEl.appendChild(el);
        return el;
      });

      function setStep(i, state, detail) {
        if (i < 0 || i > 4) return;
        if (state === "running") {
          for (let k = 0; k < i; k++) if (states[k] === "pending") setStep(k, "done", "");
        }
        states[i] = state;
        const el = stepEls[i];
        el.className = "tstep " + state;
        if (detail) el.querySelector(".tinfo").textContent = detail;
        if (state === "running") {
          headline.textContent = HEADLINES[i];
          if (detail) subline.textContent = detail;
        }
        if (state === "error") errored = true;
        if (state === "running") errored = false;
        syncBars();
        if (state === "error" && detail) subline.textContent = detail;
        // 卡头状态灯：跟随当前步骤（running=进行中 / error=异常 / 全 done=就绪）
        const cs = document.getElementById("consoleState");
        if (cs) {
          if (state === "running") { cs.textContent = "进行中"; cs.className = "console-state running"; }
          else if (state === "error") { cs.textContent = "异常"; cs.className = "console-state error"; }
          else { cs.textContent = "就绪"; cs.className = "console-state done"; }
        }
        // 下载发生在步骤 02；进入后续步骤即收起下载主角位。
        if (i >= 2 && (state === "running" || state === "done")) {
          dl.hidden = true;
          speedSamples.length = 0;
          syncBars();
        }
      }

      // ---- 下载主角位（速度/剩余时间由前端采样估算） ----
      const speedSamples = [];
      function mb(bytes) {
        return bytes >= 1048576 ? (bytes / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(bytes / 1024)) + " KB";
      }
      function fmtEta(secs) {
        if (!isFinite(secs) || secs <= 0) return "";
        if (secs < 60) return "约 " + Math.ceil(secs) + " 秒";
        return "约 " + Math.ceil(secs / 60) + " 分钟";
      }
      function showDownload(current, total) {
        dl.hidden = false; // 下载条接管动画
        syncBars();
        headline.textContent = "正在准备运行环境";
        subline.textContent = "首次使用需要下载 Node 运行时 · 仅此一次";
        const now = performance.now();
        speedSamples.push({ t: now, b: current });
        while (speedSamples.length > 2 && now - speedSamples[0].t > 6000) speedSamples.shift();
        dlBytes.textContent = total ? mb(current) + " / " + mb(total) : "已下载 " + mb(current);
        if (total) {
          const pct = Math.min(100, (current / total) * 100);
          dlPct.textContent = Math.floor(pct);
          dlFill.classList.remove("indet");
          dlFill.style.width = pct.toFixed(1) + "%";
          const s0 = speedSamples[0];
          let speedText = "", etaText = "";
          if (speedSamples.length >= 2 && now - s0.t > 800) {
            const bps = ((current - s0.b) / (now - s0.t)) * 1000;
            if (bps > 0) {
              speedText = (bps >= 1048576 ? (bps / 1048576).toFixed(1) + " MB/s" : Math.round(bps / 1024) + " KB/s");
              etaText = fmtEta((total - current) / bps);
            }
          }
          dlSpeed.textContent = speedText;
          dlEta.textContent = etaText;
        } else {
          dlPct.textContent = "···";
          dlFill.classList.add("indet");
          dlSpeed.textContent = "";
          dlEta.textContent = "";
        }
      }

      // ---- 错误卡（启动叙事的异常节点：诊断行 + 标题/详情/建议 + 动作 + 诊断日志） ----
      const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      let errorCount = 0;
      function renderError(e) {
        hero.style.display = "none";
        dl.hidden = true;
        errored = true;
        syncBars();
        errorCount++;
        const actions = (e.actions || []).map((a) => {
          const label = a === "upgrade" ? "升级 DSH 并重试" : a === "upgrade_only" ? "升级 DSH" : "重试";
          return `<button class="${a === "upgrade" || a === "upgrade_only" ? "primary" : "ghost"}" data-action="${a}">${label}</button>`;
        }).join("");
        const diag = e.title || "启动异常";
        // 故障区：单卡内部区块（不再是独立白卡）——与时间线同容器、同列宽、自然对齐
        const diagHead =
          `<div class="e-diag"><span>DIAG</span><span>${esc(diag)}</span><span style="margin-left:auto">#${String(errorCount).padStart(2, "0")}</span></div>`;
        errorBox.innerHTML =
          `<div class="e-fail">` +
          diagHead +
          `<div class="e-title">${esc(e.title || "启动失败")}</div>` +
          `<div class="e-detail">${esc(e.detail || "")}</div>` +
          (e.suggestion ? `<div class="e-suggest">${esc(e.suggestion)}</div>` : "") +
          `<div class="e-actions">${actions}</div>` +
          (e.log ? `<details open><summary>原始日志 · 尾部 ${esc(String(e.log.split("\n").length))} 行</summary><pre>${esc(e.log)}</pre></details>` : "") +
          `</div>`;
        errorBox.querySelectorAll("button").forEach((btn) => {
          btn.addEventListener("click", () => {
            btn.disabled = true;
            errorBox.querySelectorAll("button").forEach((b) => (b.disabled = true));
            window.__TAURI__.core.invoke("terminal_action", { action: btn.dataset.action }).catch((e2) => {
              renderError({ title: "动作失败", detail: String(e2 && (e2.message || e2)) });
            });
          });
        });
      }

      window.__TAURI__.event.listen("boot:step", (ev) => {
        const p = ev.payload;
        setStep(p.step, p.state, p.detail);
        if (p.state === "error") headline.textContent = "启动遇到问题";
      });
      window.__TAURI__.event.listen("boot:progress", (ev) => {
        if (ev.payload.kind === "node") showDownload(ev.payload.current, ev.payload.total);
      });
      window.__TAURI__.event.listen("boot:error", (ev) => {
        headline.textContent = "启动遇到问题";
        renderError(ev.payload);
        const w = document.getElementById("wslBtn");
        if (w) w.disabled = false; // 切换失败后允许再次尝试
      });

      // ---- 顶栏版本芯片 ----
      const vchip = document.getElementById("vchip");
      function renderClient(u) {
        const el = vchip.querySelector(".cli");
        if (!el) return;
        if (u.phase === "available" || u.phase === "downloading" || u.phase === "installing" || u.phase === "relaunching") {
          el.hidden = false;
          el.classList.add("new");
          el.textContent = u.phase === "available" ? "客户端有新版 " + u.latest : u.phase === "downloading" ? "客户端更新 " + Math.floor(100 * (u.current || 0) / (u.total || 100)) + "%" : "客户端更新中…";
        } else {
          el.hidden = true;
        }
      }
      const renderChip = (s) => {
        const dsh = s.dsh || {};
        let dot = "", text = "DSH " + (dsh.current || "…");
        if (dsh.error) { dot = ""; text = "DSH 检测失败"; }
        else if (dsh.newer) { dot = "new"; text = `DSH ${dsh.current || "?"} · 有新版 ${dsh.latest}`; }
        else if (dsh.latest && dsh.current) { dot = "ok"; text = `DSH ${dsh.current} · 已是最新`; }
        else if (dsh.latest) { text = "DSH 未检出 · 最新 " + dsh.latest; }
        else { text = "DSH " + (dsh.current || "…") + " · 检测中"; }
        vchip.innerHTML = `<span class="dot ${dot}"></span><span>${text}</span><span class="cli" hidden></span>`;
        window.__TAURI__.core.invoke("get_client_update").then(renderClient).catch(() => {});
      };
      window.__TAURI__.core.invoke("get_update_status").then(renderChip).catch(() => {});
      window.__TAURI__.event.listen("boot:update", (ev) => renderChip(ev.payload));
      window.__TAURI__.event.listen("app:update", (ev) => renderClient(ev.payload));

      // ---- 顶栏「关于」：非 macOS 无应用菜单，关于/检查更新入口在此 ----
      document.getElementById("aboutBtn").addEventListener("click", () => {
        window.__TAURI__.core.invoke("open_about").catch(() => {});
      });

      // ---- 顶栏「在 WSL 中打开」：执行环境切换（local → WSL2，零配置）----
      // 触发后关掉当前会话并启动 WSL 会话；具体探测/启动进度经 boot:step 呈现，
      // 失败经 boot:error → renderError。
      const wslBtn = document.getElementById("wslBtn");
      if (wslBtn) {
        wslBtn.addEventListener("click", () => {
          wslBtn.disabled = true;
          window.__TAURI__.core
            .invoke("boot_in_wsl")
            .catch((e) => {
              renderError({ title: "WSL 切换失败", detail: String((e && e.message) || e) });
              wslBtn.disabled = false;
            });
        });
      }

      // ---- 首次选择落地（mode.html → index.html?mode=…&default=…）----
      // 必须在 boot 事件监听注册之后 invoke：启动线程 emit 的 boot:step 才能
      // 被本页消费（无事件竞态）。
      const qp = new URLSearchParams(location.search);
      const qmode = qp.get("mode");
      if (qmode === "local" || qmode === "wsl") {
        const qdef = qp.get("default") === "1";
        window.__TAURI__.core
          .invoke("choose_mode", { mode: qmode, setDefault: qdef })
          .catch(() => {});
      }

      headline.textContent = HEADLINES[0];
    </script>
  </body>
</html>
