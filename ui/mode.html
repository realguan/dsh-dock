<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <title>DSH Dock</title>
    <link rel="stylesheet" href="assets/app.css" />
    <style>
      /* 运行环境选择（本地 / WSL2 同等地位；仅本页使用，不入 app.css） */
      .mode-pick {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 320px));
        gap: 14px;
        justify-content: center;
        margin-top: 26px;
      }
      .mode-card {
        appearance: none;
        border: 1.5px solid #e2e4ea;
        border-radius: 14px;
        background: #fff;
        padding: 18px 20px;
        text-align: left;
        cursor: pointer;
        display: block;
        transition: border-color 0.15s, box-shadow 0.15s;
      }
      .mode-card:hover { border-color: #9aa4b2; }
      .mode-card.sel {
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.16);
      }
      .mode-name { display: block; font-weight: 700; font-size: 16px; color: #181b21; }
      .mode-desc { display: block; margin-top: 6px; font-size: 12.5px; line-height: 1.55; color: #6b7280; }
      .mode-foot {
        margin-top: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
      }
      .mode-foot label { font-size: 13px; color: #4b5563; display: flex; align-items: center; gap: 6px; }
      #nextBtn {
        appearance: none;
        border: 1px solid #2563eb;
        background: #2563eb;
        color: #fff;
        border-radius: 999px;
        padding: 9px 30px;
        font-size: 14px;
        cursor: pointer;
      }
      #nextBtn:disabled { opacity: 0.45; cursor: default; }
    </style>
  </head>
  <body>
    <script>
      // WSL 仅存在于 Windows（2026-08-26 裁定）：平台能力经 Rust 编译期注入
      // （window.__DSH_PLATFORM__）。非 Windows 本页零感知——防御性跳回启动页
      // （不带 mode 参数：避免与壳启动线程的 choose_mode 双启动竞争，壳自己按
      // local 启动；本页只由旧壳的首次导航打开，现壳非 Windows 已不再进入本页）。
      if (!(window.__DSH_PLATFORM__ && window.__DSH_PLATFORM__.wsl)) {
        location.replace("index.html");
      }
    </script>
    <div class="topbar">
      <span class="wordmark">DSH DOCK</span>
    </div>

    <main class="stage">
      <section class="hero">
        <div class="emblem" aria-hidden="true"></div>
        <div class="headline">选择运行环境</div>
        <div class="subline">DSH 可以运行在本机，也可以运行在 WSL2 发行版内——随时可从菜单切换</div>
      </section>

      <section class="mode-pick" id="modePick">
        <button class="mode-card" data-mode="local">
          <span class="mode-name">本机运行</span>
          <span class="mode-desc">复用您安装的 Node 与官方 DSH；缺失时自动在线补齐（system → bundle → download）</span>
        </button>
        <button class="mode-card" data-mode="wsl">
          <span class="mode-name">WSL2 内运行</span>
          <span class="mode-desc">在 WSL2 发行版内启动 DSH（需 Windows + WSL2，发行版内已装 node 与 dsh）</span>
        </button>
      </section>

      <section class="mode-foot">
        <label><input type="checkbox" id="setDefault" checked /> 设为默认打开方式（下次自动使用）</label>
        <button id="nextBtn" disabled>开始</button>
      </section>

      <section id="errorBox"></section>
    </main>

    <script>
      // 首次运行的环境选择页：选定 → index.html?mode=…&default=…。
      // index.html 加载后会先注册 boot 事件监听、再 invoke choose_mode，
      // 启动进度原位显示在启动页（无事件竞态）。
      const cards = Array.from(document.querySelectorAll(".mode-card"));
      const nextBtn = document.getElementById("nextBtn");
      const setDefault = document.getElementById("setDefault");
      let picked = "";

      cards.forEach((card) => {
        card.addEventListener("click", () => {
          picked = card.dataset.mode;
          cards.forEach((c) => c.classList.toggle("sel", c === card));
          nextBtn.disabled = false;
        });
      });

      nextBtn.addEventListener("click", () => {
        if (!picked) return;
        nextBtn.disabled = true;
        location.assign(
          "index.html?mode=" + picked + "&default=" + (setDefault.checked ? "1" : "0")
        );
      });
    </script>
  </body>
</html>
