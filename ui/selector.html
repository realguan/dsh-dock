<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <title>选择工作台 · DSH Dock</title>
    <link rel="stylesheet" href="assets/app.css" />
  </head>
  <body>
    <div class="topbar">
      <span class="wordmark">DSH DOCK</span>
      <span class="vchip" id="vchip"></span>
    </div>

    <main class="stage">
      <!-- 阶段一：问一个问题 -->
      <section class="hero" id="hero">
        <div class="emblem" aria-hidden="true"></div>
        <div class="headline">进入哪个工作台？</div>
        <div class="subline">来自你机器上的 DSH 环境 · 选择只影响本次会话</div>
        <div class="pulse-bar" id="pulseBar" hidden><div class="pulse-fill"></div></div>
      </section>

      <div class="pick-list" id="list"></div>
      <p class="pick-hint" id="pickHint">官方 Web 工作台开箱即用；其余为你自定义装配的 webUi 工作台。</p>

      <!-- 阶段二：选定后原地切换为启动叙事（与启动页同一形态） -->
      <section class="dl" id="dl" hidden>
        <div class="dl-pct"><span id="dlPct">0</span><span class="unit">%</span></div>
        <div class="dl-bar"><div class="dl-fill" id="dlFill"></div></div>
        <div class="dl-meta">
          <span id="dlBytes">0 MB</span>
          <span class="dim" id="dlSpeed"></span>
          <span class="dim" id="dlEta"></span>
        </div>
      </section>
      <section id="errorBox"></section>
    </main>

    <script>
      // 工作台选择：一问一答 → 选定后进入与启动页一致的叙事形态。
      const pulseBar = document.getElementById("pulseBar");
      // 动效规则：选定工作台即启动，直到导航进 Web UI；仅「出错」与「下载条接管」时让位。
      let errored = false;
      function syncBars() {
        pulseBar.hidden = !selected || errored || !dl.hidden;
      }
      const qs = new URLSearchParams(location.search);
      const profiles = (qs.get("profiles") || "web").split(",").filter(Boolean);
      const hero = document.getElementById("hero");
      const list = document.getElementById("list");
      const pickHint = document.getElementById("pickHint");
      const errorBox = document.getElementById("errorBox");
      const dl = document.getElementById("dl");
      const dlPct = document.getElementById("dlPct");
      const dlFill = document.getElementById("dlFill");
      const dlBytes = document.getElementById("dlBytes");
      const dlSpeed = document.getElementById("dlSpeed");
      const dlEta = document.getElementById("dlEta");
      const headline = () => hero.querySelector(".headline");
      const subline = () => hero.querySelector(".subline");

      const META = {
        web: { title: "官方 Web 工作台", desc: "DSH 官方维护的 Web 界面", tag: "DEFAULT" },
      };

      function mb(bytes) {
        return bytes >= 1048576 ? (bytes / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(bytes / 1024)) + " KB";
      }
      function fmtEta(secs) {
        if (!isFinite(secs) || secs <= 0) return "";
        if (secs < 60) return "约 " + Math.ceil(secs) + " 秒";
        return "约 " + Math.ceil(secs / 60) + " 分钟";
      }

      let selected = false;
      const speedSamples = [];
      function showDownload(current, total) {
        dl.hidden = false; // 下载条接管动画
        syncBars();
        headline().textContent = "正在准备运行环境";
        subline().textContent = "首次使用需要下载 Node 运行时 · 仅此一次";
        const now = performance.now();
        speedSamples.push({ t: now, b: current });
        while (speedSamples.length > 2 && now - speedSamples[0].t > 6000) speedSamples.shift();
        dlBytes.textContent = total ? mb(current) + " / " + mb(total) : "已下载 " + mb(current);
        if (total) {
          const pct = Math.min(100, (current / total) * 100);
          dlPct.textContent = Math.floor(pct);
          dlFill.classList.remove("indet");
          dlFill.style.width = pct.toFixed(1) + "%";
          const s0 = speedSamples[0];
          let speedText = "", etaText = "";
          if (speedSamples.length >= 2 && now - s0.t > 800) {
            const bps = ((current - s0.b) / (now - s0.t)) * 1000;
            if (bps > 0) {
              speedText = bps >= 1048576 ? (bps / 1048576).toFixed(1) + " MB/s" : Math.round(bps / 1024) + " KB/s";
              etaText = fmtEta((total - current) / bps);
            }
          }
          dlSpeed.textContent = speedText;
          dlEta.textContent = etaText;
        } else {
          dlPct.textContent = "···";
          dlFill.classList.add("indet");
          dlSpeed.textContent = "";
          dlEta.textContent = "";
        }
      }

      function showError(payload) {
        const title = payload.title || "启动失败";
        const actions = (payload.actions || ["retry"]).map((a) => {
          const label = a === "upgrade" ? "升级 DSH 并重试" : "重试";
          return `<button class="${a === "upgrade" ? "primary" : "ghost"}" data-action="${a}">${label}</button>`;
        }).join("");
        errorBox.innerHTML =
          `<div class="error-card">` +
          `<div class="e-title">${title}</div>` +
          `<div class="e-detail">${(payload.detail || "").replace(/</g, "&lt;")}</div>` +
          (payload.suggestion ? `<div class="e-suggest">${payload.suggestion}</div>` : "") +
          `<div class="e-actions">${actions}<button class="ghost" data-action="reselect">返回重选</button></div>` +
          (payload.log ? `<details><summary>原始日志</summary><pre>${payload.log.replace(/</g, "&lt;")}</pre></details>` : "") +
          `</div>`;
        errorBox.querySelectorAll("button").forEach((btn) => {
          btn.addEventListener("click", () => {
            const a = btn.dataset.action;
            if (a === "reselect") { location.reload(); return; }
            btn.disabled = true;
            errorBox.querySelectorAll("button").forEach((b) => (b.disabled = true));
            window.__TAURI__.core.invoke("terminal_action", { action: a }).catch((e) => {
              showError({ title: "动作失败", detail: String(e && (e.message || e)) + "（可返回重选）" });
            });
          });
        });
      }

      profiles.forEach((name, i) => {
        const meta = META[name] || { title: name, desc: "自定义装配的 webUi 工作台", tag: "CUSTOM" };
        const btn = document.createElement("button");
        btn.className = "pick-item";
        btn.type = "button";
        btn.style.animationDelay = (i * 70) + "ms";
        btn.innerHTML =
          `<span class="no">${String(i + 1).padStart(2, "0")}</span>` +
          `<span><span class="name">${meta.title}</span><div class="desc">${meta.desc}</div></span>` +
          `<span class="tag">${meta.tag}</span>`;
        btn.addEventListener("click", () => {
          list.style.display = "none";
          pickHint.style.display = "none";
          hero.style.display = "";
          selected = true;
          syncBars();
          headline().textContent = "正在启动「" + meta.title + "」";
          subline().textContent = name;
          window.__TAURI__.core
            .invoke("choose_profile", { profile: name })
            .catch((e) => showError({ title: "启动失败", detail: String(e && (e.message || e)) + "（可返回重选）", actions: ["retry"] }));
        });
        list.appendChild(btn);
      });

      window.__TAURI__.event.listen("boot:step", (ev) => {
        const p = ev.payload;
        if (p.state === "error") errored = true;
        if (p.state === "running") errored = false;
        syncBars();
        if (p.state === "running") headline().textContent = ["检查运行环境", "确定启动方式", "启动 DSH", "等待工作台就绪", "即将进入工作台"][p.step] || headline().textContent;
        if (p.detail) subline().textContent = p.detail;
        if (p.step >= 2 && (p.state === "running" || p.state === "done")) {
          dl.hidden = true;
          speedSamples.length = 0;
          syncBars();
        }
        if (p.state === "error") headline().textContent = "启动遇到问题";
      });
      window.__TAURI__.event.listen("boot:progress", (ev) => {
        if (ev.payload.kind === "node") showDownload(ev.payload.current, ev.payload.total);
      });
      window.__TAURI__.event.listen("boot:error", (ev) => {
        dl.hidden = true;
        errored = true;
        syncBars();
        showError(ev.payload);
      });

      // ---- 顶栏版本芯片 ----
      const vchip = document.getElementById("vchip");
      function renderChip(s) {
        const dsh = s.dsh || {};
        let dot = "", text = "DSH " + (dsh.current || "…");
        if (dsh.error) { text = "DSH 检测失败"; }
        else if (dsh.newer) { dot = "new"; text = `DSH ${dsh.current || "?"} · 有新版 ${dsh.latest}`; }
        else if (dsh.latest && dsh.current) { dot = "ok"; text = `DSH ${dsh.current} · 已是最新`; }
        else { text = "DSH " + (dsh.current || "…") + " · 检测中"; }
        vchip.innerHTML = `<span class="dot ${dot}"></span><span>${text}</span>`;
      }
      window.__TAURI__.core.invoke("get_update_status").then(renderChip);
      window.__TAURI__.event.listen("boot:update", (ev) => renderChip(ev.payload));
    </script>
  </body>
</html>
