<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <title>更新中心 · DSH Dock</title>
    <link rel="stylesheet" href="assets/app.css" />
  </head>
  <body>
    <main class="sheet">
      <header class="head">
        <div class="emblem" aria-hidden="true"></div>
        <div class="brand">
          <div class="name">DSH Dock <span class="ver" id="cCur">…</span></div>
          <div class="role">更新中心 · 桌面客户端与运行环境</div>
        </div>
        <span class="head-dot" id="headDot" hidden></span>
      </header>

      <!-- 桌面客户端：有状态机的动作主体 -->
      <section class="upd" id="upd">
        <div class="upd-row">
          <span class="k">桌面客户端</span>
          <span class="state" id="cState"></span>
        </div>
        <div class="upd-body" id="updBody">
          <p class="upd-line"><span class="upd-big" id="cLine">正在准备…</span></p>
          <p class="upd-sub" id="cSub"></p>
          <div class="upd-acts" id="cActs"></div>
          <div class="upd-progress" id="cProg" hidden>
            <div class="upd-bar"><div class="upd-fill" id="cFill"></div></div>
            <div class="upd-meta"><span id="cBytes"></span><span id="cHint"></span></div>
          </div>
        </div>
      </section>

      <!-- 运行环境（dsh / node）：只读 + dsh 可升级 -->
      <div class="dimrows">
        <div class="dimrow">
          <span class="k">DSH</span>
          <span class="v"><span id="hVer">检测中…</span><span class="note" id="hNote"></span></span>
          <span class="acts" id="hActs"></span>
        </div>
        <div class="dimrow">
          <span class="k">Node 运行时</span>
          <span class="v"><span id="nVer">—</span><span class="note" id="nNote"></span></span>
          <span class="acts"></span>
        </div>
      </div>

      <div class="wb-open">
        <button class="chip" id="wbOpen" disabled>在浏览器中打开</button>
        <span class="note" id="wbUrl"></span>
      </div>

      <p class="foot">客户端更新由官方 Releases 签名分发，安装后自动重启。<br/>升级 DSH 只动 pnpm/npm 全局包，不触碰你的数据与配置。</p>
    </main>

    <script>
      // 更新中心：三维度。桌面客户端走自更新状态机（app:update 事件）：
      //   idle → checking → available(latest) | upToDate(latest) | failed(msg)
      //   → downloading(current,total) → installing → relaunching → done(version)
      // dsh 本体：可检查 + 可升级（upgrade_only，不打断会话）。
      // Node：只读（版本 + 来源）。
      const $ = (id) => document.getElementById(id);
      const cCur = $("cCur"), cState = $("cState"), cLine = $("cLine"), cSub = $("cSub"),
            cActs = $("cActs"), cProg = $("cProg"), cFill = $("cFill"),
            cBytes = $("cBytes"), cHint = $("cHint"), headDot = $("headDot"),
            hVer = $("hVer"), hNote = $("hNote"), hActs = $("hActs"),
            nVer = $("nVer"), nNote = $("nNote");

      const fmt = (b, t) => {
        const mb = (x) => x >= 1048576 ? (x / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(x / 1024)) + " KB";
        return t ? mb(b) + " / " + mb(t) : (b ? "已下载 " + mb(b) : "");
      };

      // ---- 桌面客户端状态机渲染 ----
      // 「检查更新」是常驻动作（检查/可用/最新/失败时都可用；
      // 进行中自动隐藏，避免并发检查）。cActs 每次重建，常驻按钮总是最后 append。
      function renderUpd(u) {
        const p = u.phase;
        cProg.hidden = true;
        cActs.innerHTML = "";
        cSub.textContent = "";
        cState.className = "state";
        cLine.className = "";
        headDot.hidden = true;
        const busy = p === "checking" || p === "downloading" || p === "installing" || p === "relaunching";
        switch (p) {
          case "checking":
            cState.textContent = "检测中…";
            cState.classList.add("busy");
            cLine.textContent = "正在检查官方更新源";
            break;
          case "available": {
            cLine.textContent = "发现新版 " + u.latest;
            cLine.classList.add("new");
            cState.classList.add("up");
            cState.textContent = "可用";
            if (u.notes) cSub.textContent = "发布说明：" + u.notes.slice(0, 120) + (u.notes.length > 120 ? "…" : "");
            const btn = document.createElement("button");
            btn.className = "chip primary";
            btn.textContent = "下载并安装 " + u.latest;
            headDot.hidden = false;
            btn.addEventListener("click", () => {
              btn.disabled = true; btn.textContent = "准备安装…";
              window.__TAURI__.core.invoke("client_update_apply")
                .catch((e) => { cLine.textContent = "更新失败"; cState.textContent = "失败"; cSub.textContent = String(e && (e.message || e)); });
            });
            cActs.appendChild(btn);
            break;
          }
          case "upToDate":
            cLine.textContent = "已是最新" + (u.latest ? "（" + u.latest + "）" : "");
            cState.classList.add("ok");
            cState.textContent = "最新";
            break;
          case "downloading": {
            cState.textContent = "下载中…";
            cState.classList.add("busy");
            cProg.hidden = false;
            const pct = u.total ? Math.min(100, (u.current / u.total) * 100) : null;
            cFill.style.width = pct === null ? "34%" : pct.toFixed(1) + "%";
            cFill.classList.toggle("indet", pct === null);
            cBytes.textContent = fmt(u.current, u.total);
            cHint.textContent = pct === null ? "获取中…" : (Math.floor(pct) + "%");
            cLine.textContent = "正在下载新版本";
            break;
          }
          case "installing":
            cState.textContent = "安装中…";
            cState.classList.add("busy");
            cLine.textContent = "正在安装新版本";
            break;
          case "relaunching":
            cState.textContent = "重启中…";
            cState.classList.add("busy");
            cLine.textContent = "即将重启进入新版本";
            break;
          case "done": {
            cLine.textContent = "已更新到 " + u.version;
            cLine.classList.add("ok");
            cState.classList.add("ok");
            cState.textContent = "完成";
            setTimeout(() => { window.__TAURI__.core.invoke("client_update_check").catch(() => {}); }, 1200);
            break;
          }
          case "failed":
            cLine.textContent = "更新失败";
            cLine.className = "err";
            cState.classList.add("err");
            cState.textContent = "失败";
            cSub.textContent = u.message || "未知错误";
            break;
          default:
            cLine.textContent = "检查更新";
            cState.textContent = "待定";
        }
        if (!busy) {
          const chk = document.createElement("button");
          chk.className = "chip";
          chk.textContent = "检查更新";
          chk.addEventListener("click", () => {
            chk.disabled = true; chk.textContent = "检测中…";
            window.__TAURI__.core.invoke("client_update_check").catch(() => { chk.disabled = false; chk.textContent = "检查更新"; });
          });
          cActs.appendChild(chk);
        }
      }

      function refreshClient() {
        return window.__TAURI__.core.invoke("get_client_update")
          .then((u) => { renderUpd(u); })
          .catch(() => {});
      }

      window.__TAURI__.event.listen("app:update", (ev) => renderUpd(ev.payload));
      refreshClient().then(() => {
        // 从未检查过（idle）→ 打开面板即自动查一次；已有结果不打扰。
        window.__TAURI__.core.invoke("get_client_update").then((u) => {
          if (u && u.phase === "idle") {
            window.__TAURI__.core.invoke("client_update_check").catch(() => {});
          }
        }).catch(() => {});
      });

      // ---- dsh 本体 / Node（沿用三维度） ----
      const setV = (el, text, note, noteCls) => {
        el.textContent = text;
        const noteEl = el.querySelector(".note");
        if (noteEl) {
          noteEl.textContent = note || "";
          noteEl.className = noteCls || "note";
        }
        el.title = el.textContent;
      };
      function render(s) {
        const c = s.client || {};
        cCur.textContent = c.current || "0";

        const d = s.dsh || {};
        if (d.error) setV(hVer, d.current ? d.current : "未检出", "DSH 检测失败（网络不可达）", "note up");
        else if (d.newer) setV(hVer, d.current ? d.current : "未检出", "有新版 " + d.latest, "note up");
        else if (d.current && d.latest) setV(hVer, d.current, "已是最新（" + d.latest + "）", "note");
        else if (!d.current && d.latest) setV(hVer, "未检出", "官方最新 " + d.latest + " · 本地尚未检出", "note");
        else setV(hVer, d.current ? d.current : "未检出", "检测中…", "note");
        let html = "";
        if (d.newer) html += `<button class="chip primary" id="hGo">升级</button>`;
        html += `<button class="chip" id="hChk">检查</button>`;
        hActs.innerHTML = html;
        const go = document.getElementById("hGo");
        if (go) go.addEventListener("click", () => {
          go.disabled = true; go.textContent = "升级中…";
          window.__TAURI__.core.invoke("terminal_action", { action: "upgrade_only" }).catch(() => { go.textContent = "升级失败"; });
        });
        const chk = document.getElementById("hChk");
        if (chk) chk.addEventListener("click", () => {
          chk.disabled = true; chk.textContent = "检测中…";
          window.__TAURI__.core.invoke("check_updates").catch(() => { chk.disabled = false; chk.textContent = "检查"; });
        });

        if (s.node) setV(nVer, s.node.version, s.node.origin === "system" ? "来自你的系统" : "应用托管 · 随启动自动准备", "note");
        else setV(nVer, "—", "尚未确定", "note");
      }
      window.__TAURI__.core.invoke("get_update_status").then(render).catch(() => {});
      window.__TAURI__.event.listen("boot:update", (ev) => render(ev.payload));

      // ---- 在浏览器中打开工作台 ----
      const wbOpen = $("wbOpen"), wbUrl = $("wbUrl");
      function renderWb(url) {
        if (url) { wbOpen.disabled = false; wbUrl.textContent = url; }
        else { wbOpen.disabled = true; wbUrl.textContent = "工作台尚未就绪"; }
      }
      window.__TAURI__.core.invoke("get_workbench_url").then(renderWb).catch(() => {});
      wbOpen.addEventListener("click", () => {
        wbOpen.disabled = true;
        window.__TAURI__.core.invoke("open_workbench_in_browser")
          .catch((e) => { wbUrl.textContent = String(e && (e.message || e)); })
          .finally(() => { window.__TAURI__.core.invoke("get_workbench_url").then(renderWb).catch(() => {}); });
      });
    </script>
  </body>
</html>
