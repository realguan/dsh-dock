<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <title>版本与更新 · DSH Dock</title>
    <link rel="stylesheet" href="assets/app.css" />
  </head>
  <body>
    <main class="sheet">
      <header class="head">
        <div class="emblem" aria-hidden="true"></div>
        <div class="brand">
          <div class="name">DSH Dock</div>
          <div class="role">DSH 的桌面呈现层</div>
        </div>
      </header>

      <!-- 三个更新维度：桌面客户端 / dsh 本体 / Node 运行时 -->
      <div class="dimrows">
        <div class="dimrow">
          <span class="k">桌面客户端</span>
          <span class="v"><span id="cVer">…</span><span class="note" id="cNote"></span></span>
          <span class="acts" id="cActs"></span>
        </div>
        <div class="dimrow">
          <span class="k">DSH</span>
          <span class="v"><span id="hVer">检测中…</span><span class="note" id="hNote"></span></span>
          <span class="acts" id="hActs"></span>
        </div>
        <div class="dimrow">
          <span class="k">Node 运行时</span>
          <span class="v"><span id="nVer">—</span><span class="note" id="nNote"></span></span>
          <span class="acts"></span>
        </div>
      </div>

      <div class="wb-open">
        <button class="chip" id="wbOpen" disabled>在浏览器中打开</button>
        <span class="note" id="wbUrl"></span>
      </div>

      <p class="foot">升级只动 pnpm/npm 全局包，不触碰你的数据与配置。<br/>DSH Dock 只做一件事：把 DSH 停进 Dock。</p>
    </main>

    <script>
      // 版本与更新：三维度（get_update_status / check_updates / boot:update）。
      //   · DSH：可检查 + 可升级（upgrade_only，不打断会话）
      //   · 桌面客户端：当前版本必显示；更新源接入前不出检查入口
      //   · Node 运行时：只读（版本 + 来源：系统 / 应用托管）
      const cVer = document.getElementById("cVer");
      const cNote = document.getElementById("cNote");
      const cActs = document.getElementById("cActs");
      const hVer = document.getElementById("hVer");
      const hNote = document.getElementById("hNote");
      const hActs = document.getElementById("hActs");
      const nVer = document.getElementById("nVer");
      const nNote = document.getElementById("nNote");

      function render(s) {
        // .v 列在空间不足时省略号截断（CSS），这里同步 title 便于悬停看全。
        const setV = (el, text, note, noteCls) => {
          el.textContent = text;
          const noteEl = el.querySelector(".note");
          if (noteEl) {
            noteEl.textContent = note || "";
            noteEl.className = noteCls || "note";
          }
          el.title = el.textContent;
        };
        // ---- 桌面客户端 ----
        const c = s.client || {};
        if (c.newer) {
          setV(cVer, c.current ? "DSH Dock " + c.current : "—", "有新版 " + c.latest, "note up");
        } else if (c.latest) {
          setV(cVer, c.current ? "DSH Dock " + c.current : "—", "已是最新", "note");
        } else if (c.error) {
          setV(cVer, c.current ? "DSH Dock " + c.current : "—", "更新源不可达", "note up");
        } else {
          setV(cVer, c.current ? "DSH Dock " + c.current : "—", "发布通道待接入", "note");
        }
        cActs.innerHTML = "";

        // ---- dsh 本体 ----
        const d = s.dsh || {};
        if (d.error) {
          setV(hVer, d.current ? d.current : "未检出", "DSH 检测失败（网络不可达）", "note up");
        } else if (d.newer) {
          setV(hVer, d.current ? d.current : "未检出", "有新版 " + d.latest, "note up");
        } else if (d.current && d.latest) {
          setV(hVer, d.current, "已是最新（" + d.latest + "）", "note");
        } else if (!d.current && d.latest) {
          // 未检出本地 dsh：多半是下载档正在补装，装完会自动刷新——不能误称「已是最新」。
          setV(hVer, "未检出", "官方最新 " + d.latest + " · 本地尚未检出", "note");
        } else {
          setV(hVer, d.current ? d.current : "未检出", "检测中…", "note");
        }
        let html = "";
        if (d.newer) {
          html += `<button class="chip primary" id="hGo">升级</button>`;
        }
        html += `<button class="chip" id="hChk">检查</button>`;
        hActs.innerHTML = html;
        const go = document.getElementById("hGo");
        if (go) go.addEventListener("click", () => {
          go.disabled = true; go.textContent = "升级中…";
          window.__TAURI__.core.invoke("terminal_action", { action: "upgrade_only" }).catch(() => {
            go.textContent = "升级失败";
          });
        });
        const chk = document.getElementById("hChk");
        if (chk) chk.addEventListener("click", () => {
          chk.disabled = true; chk.textContent = "检测中…";
          window.__TAURI__.core.invoke("check_updates").catch(() => { chk.disabled = false; chk.textContent = "检查"; });
        });

        // ---- Node 运行时 ----
        if (s.node) {
          setV(nVer, s.node.version, s.node.origin === "system" ? "来自你的系统" : "应用托管 · 随启动自动准备", "note");
        } else {
          setV(nVer, "—", "尚未确定", "note");
        }
      }
      window.__TAURI__.core.invoke("get_update_status").then(render);
      window.__TAURI__.event.listen("boot:update", (ev) => render(ev.payload));

      // ---- 在浏览器中打开工作台（dsh 就绪后可用） ----
      const wbOpen = document.getElementById("wbOpen");
      const wbUrl = document.getElementById("wbUrl");
      function renderWb(url) {
        if (url) {
          wbOpen.disabled = false;
          wbUrl.textContent = url;
        } else {
          wbOpen.disabled = true;
          wbUrl.textContent = "工作台尚未就绪";
        }
      }
      window.__TAURI__.core.invoke("get_workbench_url").then(renderWb);
      wbOpen.addEventListener("click", () => {
        wbOpen.disabled = true;
        window.__TAURI__.core.invoke("open_workbench_in_browser")
          .catch((e) => { wbUrl.textContent = String(e && (e.message || e)); })
          .finally(() => {
            window.__TAURI__.core.invoke("get_workbench_url").then(renderWb);
          });
      });
    </script>
  </body>
</html>
