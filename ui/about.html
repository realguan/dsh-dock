<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <title>版本与更新 · DSH Dock</title>
    <link rel="stylesheet" href="assets/app.css" />
  </head>
  <body>
    <main class="sheet">
      <header class="head">
        <div class="emblem" aria-hidden="true"></div>
        <div class="brand">
          <div class="name">DSH Dock</div>
          <div class="role">DSH 的桌面呈现层</div>
        </div>
      </header>

      <!-- 三个更新维度：桌面客户端 / dsh 本体 / Node 运行时 -->
      <div class="dimrows">
        <div class="dimrow">
          <span class="k">桌面客户端</span>
          <span class="v"><span id="cVer">…</span><span class="note" id="cNote"></span></span>
          <span class="acts" id="cActs"></span>
        </div>
        <div class="dimrow">
          <span class="k">DSH</span>
          <span class="v"><span id="hVer">检测中…</span><span class="note" id="hNote"></span></span>
          <span class="acts" id="hActs"></span>
        </div>
        <div class="dimrow">
          <span class="k">Node 运行时</span>
          <span class="v"><span id="nVer">—</span><span class="note" id="nNote"></span></span>
          <span class="acts"></span>
        </div>
      </div>

      <p class="foot">升级只动 pnpm/npm 全局包，不触碰你的数据与配置。<br/>DSH Dock 只做一件事：把 DSH 停进 Dock。</p>
    </main>

    <script>
      // 版本与更新：三维度（get_update_status / check_updates / boot:update）。
      //   · DSH：可检查 + 可升级（upgrade_only，不打断会话）
      //   · 桌面客户端：当前版本必显示；更新源接入前不出检查入口
      //   · Node 运行时：只读（版本 + 来源：系统 / 应用托管）
      const cVer = document.getElementById("cVer");
      const cNote = document.getElementById("cNote");
      const cActs = document.getElementById("cActs");
      const hVer = document.getElementById("hVer");
      const hNote = document.getElementById("hNote");
      const hActs = document.getElementById("hActs");
      const nVer = document.getElementById("nVer");
      const nNote = document.getElementById("nNote");

      function render(s) {
        // ---- 桌面客户端 ----
        const c = s.client || {};
        cVer.textContent = c.current ? "DSH Dock " + c.current : "—";
        if (c.newer) {
          cNote.textContent = "有新版 " + c.latest;
          cNote.className = "note up";
        } else if (c.latest) {
          cNote.textContent = "已是最新";
        } else if (c.error) {
          cNote.textContent = "更新源不可达";
          cNote.className = "note up";
        } else {
          cNote.textContent = "发布通道待接入";
        }
        cActs.innerHTML = "";

        // ---- dsh 本体 ----
        const d = s.dsh || {};
        hVer.textContent = d.current ? d.current : "未检出";
        if (d.error) {
          hNote.textContent = "DSH 检测失败（网络不可达）";
          hNote.className = "note up";
        } else if (d.newer) {
          hNote.textContent = "有新版 " + d.latest;
          hNote.className = "note up";
        } else if (d.current && d.latest) {
          hNote.textContent = "已是最新（" + d.latest + "）";
          hNote.className = "note";
        } else if (!d.current && d.latest) {
          // 未检出本地 dsh：多半是下载档正在补装，装完会自动刷新——不能误称「已是最新」。
          hNote.textContent = "官方最新 " + d.latest + " · 本地尚未检出";
          hNote.className = "note";
        } else {
          hNote.textContent = "检测中…";
        }
        let html = "";
        if (d.newer) {
          html += `<button class="chip primary" id="hGo">升级</button>`;
        }
        html += `<button class="chip" id="hChk">检查</button>`;
        hActs.innerHTML = html;
        const go = document.getElementById("hGo");
        if (go) go.addEventListener("click", () => {
          go.disabled = true; go.textContent = "升级中…";
          window.__TAURI__.core.invoke("terminal_action", { action: "upgrade_only" }).catch(() => {
            go.textContent = "升级失败";
          });
        });
        const chk = document.getElementById("hChk");
        if (chk) chk.addEventListener("click", () => {
          chk.disabled = true; chk.textContent = "检测中…";
          window.__TAURI__.core.invoke("check_updates").catch(() => { chk.disabled = false; chk.textContent = "检查"; });
        });

        // ---- Node 运行时 ----
        if (s.node) {
          nVer.textContent = s.node.version;
          nNote.textContent = s.node.origin === "system" ? "来自你的系统" : "应用托管 · 随启动自动准备";
        } else {
          nVer.textContent = "—";
          nNote.textContent = "尚未确定";
        }
      }
      window.__TAURI__.core.invoke("get_update_status").then(render);
      window.__TAURI__.event.listen("boot:update", (ev) => render(ev.payload));
    </script>
  </body>
</html>
